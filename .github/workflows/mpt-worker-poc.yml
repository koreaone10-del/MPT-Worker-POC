name: MPT Worker POC

on:
  workflow_dispatch:
    inputs:
      run_mpt_smoke:
        description: "Install MoneyPrinterTurbo and run smoke test"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  worker-poc:
    name: MoneyPrinterTurbo Worker Test
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==========================================================
      # 2. INSPECT RUNNER
      # ==========================================================

      - name: Inspect runner
        run: |
          echo "=========================================="
          echo "GITHUB RUNNER INFORMATION"
          echo "=========================================="

          echo ""
          echo "===== CPU ====="
          nproc
          lscpu | sed -n '1,25p'

          echo ""
          echo "===== MEMORY ====="
          free -h

          echo ""
          echo "===== DISK ====="
          df -h /

          echo ""
          echo "===== OS ====="
          cat /etc/os-release

          echo ""
          echo "===== KERNEL ====="
          uname -a


      # ==========================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install system dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING SYSTEM DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            git \
            curl \
            ca-certificates \
            imagemagick

          echo ""
          echo "===== FFmpeg ====="
          which ffmpeg
          ffmpeg -version | head -n 1

          echo ""
          echo "===== FFprobe ====="
          which ffprobe
          ffprobe -version | head -n 1

          echo ""
          echo "===== ImageMagick ====="
          which convert || true
          convert --version | head -n 1 || true


      # ==========================================================
      # 4. SETUP PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      # ==========================================================
      # 5. VERIFY PYTHON
      # ==========================================================

      - name: Verify Python
        run: |
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo ""
          echo "Python executable:"
          python -c "import sys; print(sys.executable)"

          echo ""
          echo "Pip:"
          python -m pip --version


      # ==========================================================
      # 6. INSTALL UV
      # ==========================================================

      - name: Install uv
        run: |
          echo "=========================================="
          echo "INSTALLING UV"
          echo "=========================================="

          python -m pip install --upgrade pip

          python -m pip install uv

          echo ""
          echo "uv version:"
          uv --version


      # ==========================================================
      # 7. INSTALL YT-DLP
      # ==========================================================

      - name: Install yt-dlp
        run: |
          echo "=========================================="
          echo "INSTALLING YT-DLP"
          echo "=========================================="

          python -m pip install --no-cache-dir yt-dlp

          echo ""
          echo "yt-dlp version:"
          yt-dlp --version


      # ==========================================================
      # 8. CLONE MONEYPRINTERTURBO
      # ==========================================================

      - name: Clone MoneyPrinterTurbo
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          echo "=========================================="
          echo "CLONING MONEYPRINTERTURBO"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            mpt

          cd mpt

          echo ""
          echo "===== MPT DIRECTORY ====="
          pwd

          echo ""
          echo "===== MPT COMMIT ====="
          git rev-parse HEAD

          echo ""
          echo "===== MPT FILES ====="
          ls -la


      # ==========================================================
      # 9. VERIFY MPT PROJECT FILES
      # ==========================================================

      - name: Verify MPT project files
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "VERIFYING MPT PROJECT"
          echo "=========================================="

          echo ""
          echo "===== pyproject.toml ====="

          test -f pyproject.toml

          echo "pyproject.toml: FOUND"

          echo ""
          echo "===== uv.lock ====="

          test -f uv.lock

          echo "uv.lock: FOUND"

          echo ""
          echo "===== requirements.txt ====="

          if [ -f requirements.txt ]; then
            echo "requirements.txt: FOUND"
          else
            echo "requirements.txt: NOT FOUND"
          fi

          echo ""
          echo "===== Important files ====="

          test -f main.py
          echo "main.py: FOUND"

          test -f cli.py
          echo "cli.py: FOUND"

          test -d app
          echo "app/: FOUND"

          test -d webui
          echo "webui/: FOUND"


      # ==========================================================
      # 10. INSTALL MPT DEPENDENCIES
      # ==========================================================

      - name: Install MPT dependencies
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "INSTALLING MPT DEPENDENCIES"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "uv:"
          uv --version

          echo ""
          echo "Running:"
          echo "uv sync --frozen"

          uv sync --frozen

          echo ""
          echo "=========================================="
          echo "MPT DEPENDENCIES INSTALLED"
          echo "=========================================="


      # ==========================================================
      # 11. VERIFY UV ENVIRONMENT
      # ==========================================================

      - name: Verify uv environment
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "VERIFYING UV ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "===== Virtual environment ====="

          test -d .venv

          echo ".venv: FOUND"

          echo ""
          echo "===== Python through uv ====="

          uv run python --version

          echo ""
          echo "===== Python executable through uv ====="

          uv run python -c "import sys; print(sys.executable)"

          echo ""
          echo "===== Installed packages ====="

          uv pip list


      # ==========================================================
      # 12. MPT DEPENDENCY SMOKE TEST
      # ==========================================================

      - name: MPT dependency smoke test
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "MONEYPRINTERTURBO DEPENDENCY SMOKE TEST"
          echo "=========================================="

          echo ""
          echo "===== Python ====="

          uv run python --version

          echo ""
          echo "===== Python executable ====="

          uv run python -c "import sys; print(sys.executable)"

          echo ""
          echo "===== FFmpeg ====="

          which ffmpeg
          ffmpeg -version | head -n 1

          echo ""
          echo "===== FFprobe ====="

          which ffprobe
          ffprobe -version | head -n 1

          echo ""
          echo "===== Python imports ====="

          uv run python - <<'PY'
          import sys

          print("Python:", sys.version)
          print("Executable:", sys.executable)

          print("")
          print("Testing requests...")
          import requests
          print("requests:", requests.__version__, "OK")

          print("")
          print("Testing moviepy...")
          import moviepy
          print("moviepy:", moviepy.__version__, "OK")

          print("")
          print("Testing streamlit...")
          import streamlit
          print("streamlit:", streamlit.__version__, "OK")

          print("")
          print("Testing fastapi...")
          import fastapi
          print("fastapi:", fastapi.__version__, "OK")

          print("")
          print("Testing uvicorn...")
          import uvicorn
          print("uvicorn:", uvicorn.__version__, "OK")

          print("")
          print("Testing edge-tts...")
          import edge_tts
          print("edge-tts: OK")

          print("")
          print("Testing faster-whisper...")
          import faster_whisper
          print("faster-whisper: OK")

          print("")
          print("Testing loguru...")
          import loguru
          print("loguru: OK")

          print("")
          print("Testing pydub...")
          import pydub
          print("pydub: OK")

          print("")
          print("Testing yaml...")
          import yaml
          print("PyYAML: OK")

          print("")
          print("Testing openai...")
          import openai
          print("openai:", openai.__version__, "OK")

          print("")
          print("==========================================")
          print("ALL MPT PYTHON DEPENDENCIES: OK")
          print("==========================================")
          PY


      # ==========================================================
      # 13. CHECK MPT CLI
      # ==========================================================

      - name: Check MPT CLI
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "CHECKING MPT CLI"
          echo "=========================================="

          uv run python cli.py --help

          echo ""
          echo "=========================================="
          echo "MPT CLI: OK"
          echo "=========================================="


      # ==========================================================
      # 14. CHECK MPT MAIN API
      # ==========================================================

      - name: Check MPT main API syntax
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "CHECKING MPT MAIN API"
          echo "=========================================="

          uv run python -m py_compile main.py

          echo ""
          echo "main.py syntax: OK"


      # ==========================================================
      # 15. CHECK MPT APPLICATION IMPORTS
      # ==========================================================

      - name: Check MPT application
        if: ${{ inputs.run_mpt_smoke }}
        run: |
          cd mpt

          echo "=========================================="
          echo "CHECKING MPT APPLICATION"
          echo "=========================================="

          uv run python - <<'PY'
          import sys

          print("Python:", sys.version)

          print("")
          print("Importing MPT application modules...")

          import app

          print("app: OK")

          print("")
          print("MPT application import test: OK")
          PY


      # ==========================================================
      # 16. FINAL ENVIRONMENT REPORT
      # ==========================================================

      - name: Final environment report
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL RESOURCE REPORT"
          echo "=========================================="

          echo ""
          echo "===== CPU ====="
          nproc

          echo ""
          echo "===== RAM ====="
          free -h

          echo ""
          echo "===== DISK ====="
          df -h /

          echo ""
          echo "===== Python ====="
          python --version || true

          echo ""
          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 1 || true

          echo ""
          echo "===== uv ====="
          uv --version || true

          echo ""
          echo "=========================================="
          echo "MPT WORKER POC FINISHED"
          echo "=========================================="
