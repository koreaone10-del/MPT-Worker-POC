name: MPT Video Generation POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpt-video-test:
    name: Generate First MPT Video
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==========================================================
      # 2. RUNNER INFORMATION
      # ==========================================================

      - name: Inspect runner
        run: |
          echo "=========================================="
          echo "RUNNER INFORMATION"
          echo "=========================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "DISK:"
          df -h /

          echo ""
          echo "OS:"
          cat /etc/os-release


      # ==========================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install system dependencies
        run: |
          echo "=========================================="
          echo "INSTALL SYSTEM DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            git \
            curl \
            ca-certificates \
            imagemagick

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "FFprobe:"
          ffprobe -version | head -n 1


      # ==========================================================
      # 4. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      # ==========================================================
      # 5. INSTALL UV
      # ==========================================================

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

          echo ""
          echo "uv:"
          uv --version


      # ==========================================================
      # 6. CLONE MPT
      # ==========================================================

      - name: Clone MoneyPrinterTurbo
        run: |
          echo "=========================================="
          echo "CLONING MONEYPRINTERTURBO"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            mpt

          cd mpt

          echo ""
          echo "MPT commit:"
          git rev-parse HEAD


      # ==========================================================
      # 7. INSTALL MPT ENVIRONMENT
      # ==========================================================

      - name: Install MPT environment
        run: |
          cd mpt

          echo "=========================================="
          echo "INSTALLING MPT ENVIRONMENT"
          echo "=========================================="

          uv sync --frozen

          echo ""
          echo "Python:"
          uv run python --version

          echo ""
          echo "Environment:"
          test -d .venv
          echo ".venv OK"


      # ==========================================================
      # 8. CREATE TEST VIDEO MATERIAL
      # ==========================================================

      - name: Create local test video
        run: |
          cd mpt

          echo "=========================================="
          echo "CREATING LOCAL TEST VIDEO"
          echo "=========================================="

          mkdir -p test_assets

          ffmpeg \
            -y \
            -f lavfi \
            -i "testsrc2=size=720x1280:rate=30" \
            -t 8 \
            -pix_fmt yuv420p \
            -c:v libx264 \
            -preset veryfast \
            -crf 28 \
            test_assets/test_source.mp4

          echo ""
          echo "===== TEST VIDEO ====="

          ls -lh test_assets/test_source.mp4

          echo ""
          echo "===== VIDEO INFORMATION ====="

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            test_assets/test_source.mp4


      # ==========================================================
      # 9. VERIFY CLI
      # ==========================================================

      - name: Verify MPT CLI
        run: |
          cd mpt

          echo "=========================================="
          echo "MPT CLI"
          echo "=========================================="

          uv run python cli.py --help | head -n 120


      # ==========================================================
      # 10. GENERATE VIDEO WITH MPT
      # ==========================================================

      - name: Generate first MPT video
        run: |
          cd mpt

          echo "=========================================="
          echo "STARTING REAL MPT VIDEO GENERATION"
          echo "=========================================="

          echo ""
          echo "Subject:"
          echo "How artificial intelligence is changing everyday life"

          echo ""
          echo "Pipeline:"
          echo "Prepared script"
          echo "        ↓"
          echo "Local video material"
          echo "        ↓"
          echo "MPT"
          echo "        ↓"
          echo "FFmpeg"
          echo "        ↓"
          echo "Final MP4"

          echo ""
          echo "=========================================="

          uv run python cli.py \
            --video-script "Artificial intelligence is changing everyday life. From smartphones to smart assistants, AI is becoming part of the tools people use every day. Modern AI can help people understand information, automate repetitive tasks, create content, and solve complex problems faster. The future of AI will depend on using these technologies responsibly while keeping people at the center of innovation." \
            --video-source local \
            --video-materials "./test_assets/test_source.mp4" \
            --video-aspect "9:16" \
            --video-count 1 \
            --voice-name no-voice \
            --no-subtitle-enabled \
            --stop-at video


      # ==========================================================
      # 11. FIND GENERATED VIDEO
      # ==========================================================

      - name: Find generated video
        run: |
          cd mpt

          echo "=========================================="
          echo "SEARCHING FOR GENERATED VIDEO"
          echo "=========================================="

          echo ""
          echo "Task directories:"
          find storage/tasks \
            -maxdepth 3 \
            -type f \
            -printf "%p\n" \
            2>/dev/null || true

          echo ""
          echo "MP4 files:"
          find storage/tasks \
            -type f \
            -iname "*.mp4" \
            -printf "%p\n" \
            2>/dev/null || true


      # ==========================================================
      # 12. VERIFY GENERATED MP4
      # ==========================================================

      - name: Verify generated MP4
        run: |
          cd mpt

          echo "=========================================="
          echo "VERIFYING GENERATED VIDEO"
          echo "=========================================="

          VIDEO=$(find storage/tasks \
            -type f \
            -iname "*.mp4" \
            -printf "%p\n" \
            2>/dev/null | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo ""
            echo "ERROR: No MP4 file was generated."
            exit 1
          fi

          echo ""
          echo "Generated video:"
          echo "$VIDEO"

          echo ""
          echo "File size:"
          ls -lh "$VIDEO"

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,codec_name,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo ""
          echo "=========================================="
          echo "MPT VIDEO GENERATION: SUCCESS"
          echo "=========================================="


      # ==========================================================
      # 13. UPLOAD GENERATED VIDEO
      # ==========================================================

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mpt-generated-video
          path: |
            mpt/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7


      # ==========================================================
      # 14. UPLOAD MPT TASK LOGS
      # ==========================================================

      - name: Upload MPT task files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mpt-task-output
          path: |
            mpt/storage/tasks/
          if-no-files-found: warn
          retention-days: 7


      # ==========================================================
      # 15. FINAL RESOURCE REPORT
      # ==========================================================

      - name: Final resource report
        if: always()
        run: |
          echo "=========================================="
          echo "FINAL RESOURCE REPORT"
          echo "=========================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "DISK:"
          df -h /

          echo ""
          echo "Python:"
          python --version || true

          echo ""
          echo "uv:"
          uv --version || true

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1 || true

          echo ""
          echo "=========================================="
          echo "MPT VIDEO POC FINISHED"
          echo "=========================================="
