name: MPT OpenRouter + Pixabay Worker

on:
  repository_dispatch:
    types: [mpt_job]

  workflow_dispatch:
    inputs:
      job_id:
        description: "Job UUID"
        required: true
        type: string

      video_subject:
        description: "Video subject"
        required: true
        type: string

      aspect:
        description: "Aspect ratio"
        required: false
        default: "9:16"
        type: string

      video_count:
        description: "Number of videos"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com
      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      REQUEST_JSON: ${{ toJSON(github.event.client_payload.request) }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout worker repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. READ WEBSITE REQUEST
      # ============================================================

      - name: Prepare job variables
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          request_raw = os.environ.get("REQUEST_JSON", "").strip()

          try:
              request = json.loads(request_raw) if request_raw else {}
          except json.JSONDecodeError:
              request = {}

          if not isinstance(request, dict):
              request = {}

          event_payload = os.environ.get("GITHUB_EVENT_PATH", "")
          event = {}

          if event_payload and os.path.exists(event_payload):
              with open(event_payload, "r", encoding="utf-8") as f:
                  event = json.load(f)

          client = event.get("client_payload") or {}
          inputs = event.get("inputs") or {}

          def first(*values, default=""):
              for value in values:
                  if value is not None and str(value).strip() != "":
                      return value
              return default

          def as_bool(value, default=True):
              if isinstance(value, bool):
                  return value

              if value is None:
                  return default

              return str(value).strip().lower() in {
                  "1",
                  "true",
                  "yes",
                  "on",
                  "enabled"
              }

          # ------------------------------------------------------------
          # BASIC VALUES
          # ------------------------------------------------------------

          job_id = first(
              client.get("job_id"),
              inputs.get("job_id"),
          )

          subject = first(
              request.get("subject"),
              client.get("video_subject"),
              inputs.get("video_subject"),
          )

          aspect = first(
              request.get("aspect_ratio"),
              client.get("aspect"),
              inputs.get("aspect"),
              default="9:16",
          )

          video_count = first(
              request.get("video_count"),
              client.get("video_count"),
              inputs.get("video_count"),
              default="1",
          )

          language = str(
              request.get("language") or "ar"
          ).strip().lower()

          duration = int(
              request.get("duration") or 30
          )

          voice = str(
              request.get("voice") or "ar-male"
          ).strip()

          subtitles = as_bool(
              request.get("subtitles"),
              True
          )

          subtitle_provider = str(
              request.get("subtitle_provider") or "edge"
          ).strip().lower()

          script = str(
              request.get("script") or ""
          ).strip()

          music = as_bool(
              request.get("music"),
              True
          )

          # ------------------------------------------------------------
          # VALIDATION
          # ------------------------------------------------------------

          allowed_aspects = {
              "9:16",
              "16:9",
              "1:1"
          }

          if aspect not in allowed_aspects:
              aspect = "9:16"

          allowed_durations = {
              30,
              45,
              60,
              90,
              120
          }

          if duration not in allowed_durations:
              duration = min(
                  allowed_durations,
                  key=lambda x: abs(x - duration)
              )

          try:
              video_count = max(
                  1,
                  min(
                      5,
                      int(video_count)
                  )
              )
          except (TypeError, ValueError):
              video_count = 1

          # ------------------------------------------------------------
          # LANGUAGE
          # ------------------------------------------------------------

          language_codes = {
              "ar": "ar-SA",
              "fr": "fr-FR",
              "en": "en-US",
          }

          video_language = language_codes.get(
              language,
              "ar-SA"
          )

          # ------------------------------------------------------------
          # VOICE
          # ------------------------------------------------------------

          voice_map = {
              "ar-male": "ar-SA-HamedNeural",
              "ar-female": "ar-SA-ZariyahNeural",

              "fr-male": "fr-FR-HenriNeural",
              "fr-female": "fr-FR-DeniseNeural",

              "en-male": "en-US-GuyNeural",
              "en-female": "en-US-JennyNeural",

              "male": {
                  "ar": "ar-SA-HamedNeural",
                  "fr": "fr-FR-HenriNeural",
                  "en": "en-US-GuyNeural",
              }.get(
                  language,
                  "ar-SA-HamedNeural"
              ),

              "female": {
                  "ar": "ar-SA-ZariyahNeural",
                  "fr": "fr-FR-DeniseNeural",
                  "en": "en-US-JennyNeural",
              }.get(
                  language,
                  "ar-SA-ZariyahNeural"
              ),
          }

          voice_key = voice.lower()

          if voice_key in {
              "none",
              "no-voice",
              "disabled",
              "off"
          }:
              voice_name = "no-voice"

          elif "neural" in voice_key:
              voice_name = voice

          else:
              voice_name = voice_map.get(
                  voice_key,
                  voice_map.get(
                      f"{language}-male",
                      "ar-SA-HamedNeural"
                  )
              )

          # ------------------------------------------------------------
          # SUBTITLES
          # ------------------------------------------------------------

          if not subtitles:
              subtitle_enabled = "false"
          else:
              subtitle_enabled = "true"

          if subtitle_provider not in {
              "edge",
              "whisper",
              "none"
          }:
              subtitle_provider = "edge"

          if subtitle_provider == "none":
              subtitle_enabled = "false"

          # ------------------------------------------------------------
          # MUSIC
          # ------------------------------------------------------------

          bgm_type = "random" if music else "none"

          # ------------------------------------------------------------
          # FONT
          # ------------------------------------------------------------

          if language == "ar":
              font_name = "NotoSansArabicUI-Regular.ttf"
              words_per_second = 2.0
          else:
              font_name = "NotoSans-Regular.ttf"
              words_per_second = 2.25

          # ------------------------------------------------------------
          # SCRIPT LENGTH
          # ------------------------------------------------------------

          target_words = max(
              35,
              round(
                  duration * words_per_second
              )
          )

          min_words = max(
              25,
              round(
                  target_words * 0.88
              )
          )

          max_words = round(
              target_words * 1.12
          )

          # ------------------------------------------------------------
          # IMPROVED VISUAL SCRIPT PROMPT
          # ------------------------------------------------------------

          script_prompt = f"""
          Create the narration for a professional short-form
          social-media video.

          TOPIC:
          {subject}

          LANGUAGE:
          {video_language}

          TARGET FINAL DURATION:
          approximately {duration} seconds.

          LENGTH:
          approximately {target_words} spoken words.

          ACCEPTABLE RANGE:
          {min_words} to {max_words} words.

          ============================================================
          CRITICAL VISUAL MATCHING RULES
          ============================================================

          1. Stay STRICTLY focused on the requested topic.

          2. Do NOT introduce unrelated subjects.

          3. Do NOT randomly mention:
             - animals
             - religion
             - technology
             - nature
             - buildings
             - people
             - locations
             - objects
             unless they are directly relevant to the topic.

          4. Every sentence must describe an idea that can be
             represented visually.

          5. Prefer concrete visual elements:
             - people
             - objects
             - places
             - actions
             - situations
             - environments
             - visible results

          6. Avoid vague abstract sentences.

          7. Avoid generic filler such as:
             "In today's world"
             "This is very important"
             "Everything starts with..."
             unless it directly supports the topic.

          8. Use specific nouns and visible actions.

          9. Make the narration progress naturally from one
             visual idea to the next.

          10. The narration must make it easy for a stock-video
              search engine such as Pixabay to find relevant footage.

          11. Do not create random examples simply to fill the
              requested duration.

          12. Do not mention these instructions in the output.

          ============================================================
          OUTPUT RULES
          ============================================================

          - narration only
          - no title
          - no scene labels
          - no bullet points
          - no numbered list
          - no explanation
          - natural spoken language
          - suitable for professional voice-over
          """

          # ------------------------------------------------------------
          # PARAGRAPHS
          # ------------------------------------------------------------

          if duration <= 60:
              paragraph_number = 1
          elif duration <= 90:
              paragraph_number = 2
          else:
              paragraph_number = 3

          # ------------------------------------------------------------
          # WRITE VARIABLES TO GITHUB_ENV
          #
          # IMPORTANT:
          # These MUST be written to $GITHUB_ENV.
          # They become available in the NEXT GitHub Actions step.
          # ------------------------------------------------------------

          def write_env(name, value):
              value = str(value)
              delimiter = f"GHENV_{name}_END"

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8"
              ) as env_file:

                  env_file.write(
                      f"{name}<<{delimiter}\n"
                  )

                  env_file.write(
                      value
                  )

                  env_file.write(
                      "\n"
                  )

                  env_file.write(
                      f"{delimiter}\n"
                  )

          write_env(
              "JOB_ID",
              job_id
          )

          write_env(
              "VIDEO_SUBJECT",
              subject
          )

          write_env(
              "VIDEO_ASPECT",
              aspect
          )

          write_env(
              "VIDEO_COUNT",
              video_count
          )

          write_env(
              "VIDEO_LANGUAGE",
              video_language
          )

          write_env(
              "TARGET_DURATION",
              duration
          )

          write_env(
              "VOICE_NAME",
              voice_name
          )

          write_env(
              "SUBTITLE_PROVIDER",
              subtitle_provider
          )

          write_env(
              "SUBTITLE_ENABLED",
              subtitle_enabled
          )

          write_env(
              "BGM_TYPE",
              bgm_type
          )

          write_env(
              "FONT_NAME",
              font_name
          )

          write_env(
              "PARAGRAPH_NUMBER",
              paragraph_number
          )

          write_env(
              "TARGET_WORDS",
              target_words
          )

          write_env(
              "MIN_WORDS",
              min_words
          )

          write_env(
              "MAX_WORDS",
              max_words
          )

          write_env(
              "SCRIPT_PROMPT",
              script_prompt
          )

          write_env(
              "USER_SCRIPT",
              script
          )

          # ------------------------------------------------------------
          # LOCAL VALIDATION
          #
          # Do NOT reference shell variables here.
          # The values are intentionally exported for the next step.
          # ------------------------------------------------------------

          if not job_id:
              raise SystemExit("Missing JOB_ID")

          if not subject:
              raise SystemExit("Missing VIDEO_SUBJECT")

          print("Job variables prepared successfully.")
          print(f"JOB_ID: {job_id}")
          print(f"SUBJECT: {subject}")
          print(f"ASPECT: {aspect}")
          print(f"LANGUAGE: {video_language}")
          print(f"DURATION: {duration}")
          print(f"VOICE: {voice_name}")
          print(f"SUBTITLES: {subtitle_enabled}")
          print(f"FONT: {font_name}")

      # ============================================================
      # 3. CALLBACK
      # ============================================================

      - name: Callback - Starting
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Worker-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data "{\"status\":\"running\",\"progress\":5,\"stage\":\"Starting\"}"


      # ============================================================
      # 4. SYSTEM PACKAGES + ARABIC FONTS
      # ============================================================

      - name: Install system dependencies and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates \
            fonts-noto-core \
            fonts-noto-ui-core

          mkdir -p /tmp/mpt-fonts

          test -f \
            /usr/share/fonts/truetype/noto/NotoSansArabicUI-Regular.ttf

          test -f \
            /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf

          cp \
            /usr/share/fonts/truetype/noto/NotoSansArabicUI-Regular.ttf \
            /tmp/mpt-fonts/NotoSansArabicUI-Regular.ttf

          cp \
            /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf \
            /tmp/mpt-fonts/NotoSans-Regular.ttf


      # ============================================================
      # 5. CALLBACK
      # ============================================================

      - name: Callback - Preparing
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Worker-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data "{\"status\":\"running\",\"progress\":10,\"stage\":\"Preparing\"}"


      # ============================================================
      # 6. CLONE MPT
      # ============================================================

      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          uv sync --frozen

          mkdir -p resource/fonts

          cp \
            /tmp/mpt-fonts/NotoSansArabicUI-Regular.ttf \
            resource/fonts/

          cp \
            /tmp/mpt-fonts/NotoSans-Regular.ttf \
            resource/fonts/

          test -f \
            "resource/fonts/${FONT_NAME}"


      # ============================================================
      # 7. CONFIGURE OPENROUTER + PIXABAY
      # ============================================================

      - name: Configure OpenRouter and Pixabay
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          src = Path("config.example.toml")
          dst = Path("config.toml")

          text = src.read_text(
              encoding="utf-8"
          )

          def toml_string(value):
              return (
                  '"'
                  + value
                      .replace("\\", "\\\\")
                      .replace('"', '\\"')
                  + '"'
              )

          replacements = {
              "llm_provider":
                  '"openrouter"',

              "openrouter_api_key":
                  toml_string(
                      os.environ["OPENROUTER_API_KEY"]
                  ),

              "openrouter_base_url":
                  '"https://openrouter.ai/api/v1"',

              "openrouter_model_name":
                  '"openrouter/free"',

              "video_source":
                  '"pixabay"',

              "pixabay_api_keys":
                  "[" +
                  toml_string(
                      os.environ["PIXABAY_API_KEY"]
                  ) +
                  "]",

              "match_materials_to_script":
                  "true",

              "subtitle_provider":
                  toml_string(
                      os.environ["SUBTITLE_PROVIDER"]
                  ),
          }

          for key, value in replacements.items():

              pattern = (
                  rf'(?m)^{re.escape(key)}'
                  r'\s*=\s*.*$'
              )

              if not re.search(
                  pattern,
                  text
              ):
                  raise SystemExit(
                      f"Missing config key: {key}"
                  )

              text = re.sub(
                  pattern,
                  f"{key} = {value}",
                  text,
                  count=1
              )

          dst.write_text(
              text,
              encoding="utf-8"
          )
          PY

          test -s config.toml


      # ============================================================
      # 8. CREATE MPT TASK
      # ============================================================

      - name: Create MPT task manifest
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          python3 - <<'PY'
          import json
          import os

          user_script = os.environ.get(
              "USER_SCRIPT",
              ""
          ).strip()

          task = {
              "video_subject":
                  os.environ["VIDEO_SUBJECT"],

              "video_source":
                  "pixabay",

              "video_count":
                  int(os.environ["VIDEO_COUNT"]),

              "video_aspect":
                  os.environ["VIDEO_ASPECT"],

              "video_language":
                  os.environ["VIDEO_LANGUAGE"],

              "paragraph_number":
                  int(os.environ["PARAGRAPH_NUMBER"]),

              "video_script_prompt":
                  os.environ["SCRIPT_PROMPT"],

              "video_concat_mode":
                  "sequential",

              "video_transition_mode":
                  "None",

              "video_clip_duration":
                  3,

              "video_clip_speed":
                  1.0,

              "match_materials_to_script":
                  True,

              "video_fit_mode":
                  "cover",

              "n_threads":
                  2,

              "voice_name":
                  os.environ["VOICE_NAME"],

              "voice_volume":
                  1.0,

              "voice_rate":
                  1.0,

              "bgm_type":
                  os.environ["BGM_TYPE"],

              "bgm_file":
                  "",

              "bgm_volume":
                  0.15,

              "subtitle_enabled":
                  os.environ["SUBTITLE_ENABLED"].lower() == "true",

              "font_name":
                  os.environ["FONT_NAME"],
          }

          if user_script:
              task["video_script"] = user_script

          with open(
              "mpt-task.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  [task],
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

          cat mpt-task.json


      # ============================================================
      # 9. CALLBACK
      # ============================================================

      - name: Callback - Generating
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Worker-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data "{\"status\":\"running\",\"progress\":20,\"stage\":\"Generating script, voice and matching Pixabay footage\"}"


      # ============================================================
      # 10. GENERATE
      # ============================================================

      - name: Generate video
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          uv run python cli.py \
            --batch-file ./mpt-task.json \
            --stop-at video


      # ============================================================
      # 11. FIND VIDEO
      # ============================================================

      - name: Find generated video
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          FINAL_VIDEO="$(
            find storage/tasks \
              -type f \
              \( \
                -name 'final-*.mp4' \
                -o \
                -name 'final.mp4' \
              \) \
              -printf '%T@ %p\n' \
              2>/dev/null \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-
          )"

          test -n "${FINAL_VIDEO}"
          test -f "${FINAL_VIDEO}"

          cp \
            "${FINAL_VIDEO}" \
            "${GITHUB_WORKSPACE}/final-video.mp4"

          echo \
            "FINAL_VIDEO=${GITHUB_WORKSPACE}/final-video.mp4" \
            >> "${GITHUB_ENV}"


      # ============================================================
      # 12. INSPECT
      # ============================================================

      - name: Inspect final video
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected duration: ${TARGET_DURATION}s"
          echo "Aspect: ${VIDEO_ASPECT}"
          echo "Language: ${VIDEO_LANGUAGE}"
          echo "Voice: ${VOICE_NAME}"
          echo "Subtitle provider: ${SUBTITLE_PROVIDER}"
          echo "Subtitle font: ${FONT_NAME}"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"


      # ============================================================
      # 13. CALLBACK
      # ============================================================

      - name: Callback - Uploading
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Worker-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data "{\"status\":\"running\",\"progress\":85,\"stage\":\"Uploading final video\"}"


      # ============================================================
      # 14. UPLOAD TO RENDER
      # ============================================================

      - name: Upload video to Render
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl -fsS -X POST \
              "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
              -H "X-Worker-Secret: ${RENDER_CALLBACK_SECRET}" \
              -F "file=@${FINAL_VIDEO};type=video/mp4"
          )"

          echo "${RESPONSE}"

          OUTPUT_URL="$(
            python3 -c '
          import json
          import sys

          data = json.loads(
              sys.stdin.read()
          )

          print(
              data.get(
                  "output_url",
                  ""
              )
          )
          ' <<< "${RESPONSE}"
          )"

          test -n "${OUTPUT_URL}"

          echo \
            "OUTPUT_URL=${OUTPUT_URL}" \
            >> "${GITHUB_ENV}"


      # ============================================================
      # 15. COMPLETED
      # ============================================================

      - name: Callback - Completed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "status":
                  "completed",

              "progress":
                  100,

              "stage":
                  "Completed",

              "output_url":
                  os.environ["OUTPUT_URL"],
          }

          request = urllib.request.Request(
              (
                  f'{os.environ["RENDER_CALLBACK_URL"]}'
                  f'/api/worker/jobs/'
                  f'{os.environ["JOB_ID"]}'
                  f'/callback'
              ),

              data=json.dumps(
                  payload
              ).encode("utf-8"),

              headers={
                  "Content-Type":
                      "application/json",

                  "X-Worker-Secret":
                      os.environ[
                          "RENDER_CALLBACK_SECRET"
                      ],
              },

              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:

              print(
                  response.read().decode(
                      "utf-8"
                  )
              )
          PY


      # ============================================================
      # 16. ARTIFACT
      # ============================================================

      - name: Upload workflow artifact
        if: always() && hashFiles('final-video.mp4') != ''
        uses: actions/upload-artifact@v5
        with:
          name: mpt-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-video.mp4
          if-no-files-found: ignore


      # ============================================================
      # 17. FAILURE CALLBACK
      # ============================================================

      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          job_id = os.environ.get(
              "JOB_ID",
              ""
          ).strip()

          if not job_id:
              raise SystemExit(0)

          payload = {
              "status":
                  "failed",

              "progress":
                  0,

              "stage":
                  "Worker failed",

              "error":
                  "GitHub Actions worker failed. "
                  "Check the workflow logs for the exact step.",
          }

          try:

              request = urllib.request.Request(
                  (
                      f'{os.environ["RENDER_CALLBACK_URL"]}'
                      f'/api/worker/jobs/'
                      f'{job_id}'
                      f'/callback'
                  ),

                  data=json.dumps(
                      payload
                  ).encode("utf-8"),

                  headers={
                      "Content-Type":
                          "application/json",

                      "X-Worker-Secret":
                          os.environ[
                              "RENDER_CALLBACK_SECRET"
                          ],
                  },

                  method="POST",
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      response.read().decode(
                          "utf-8"
                      )
                  )

          except Exception as exc:

              print(
                  f"Failed to notify Render: {exc}"
              )
          PY
