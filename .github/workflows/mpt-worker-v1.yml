name: MPT Worker v1

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      video_subject:
        description: "Video subject"
        required: true
        type: string

      aspect:
        description: "Video aspect ratio"
        required: true
        default: "9:16"
        type: string

      video_count:
        description: "Number of videos"
        required: true
        default: "1"
        type: string

  repository_dispatch:
    types:
      - mpt_job

permissions:
  contents: read

env:
  RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com
  RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

jobs:
  mpt:
    name: MPT Pixabay Worker
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Prepare job variables
      # ============================================================

      - name: Prepare job variables
        shell: bash
        env:
          DISPATCH_JOB_ID: ${{ github.event.client_payload.job_id }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.video_subject }}
          DISPATCH_ASPECT: ${{ github.event.client_payload.aspect }}
          DISPATCH_COUNT: ${{ github.event.client_payload.video_count }}

          MANUAL_JOB_ID: ${{ inputs.job_id }}
          MANUAL_SUBJECT: ${{ inputs.video_subject }}
          MANUAL_ASPECT: ${{ inputs.aspect }}
          MANUAL_COUNT: ${{ inputs.video_count }}

        run: |
          set -e

          JOB_ID="${DISPATCH_JOB_ID:-$MANUAL_JOB_ID}"
          VIDEO_SUBJECT="${DISPATCH_SUBJECT:-$MANUAL_SUBJECT}"
          ASPECT="${DISPATCH_ASPECT:-$MANUAL_ASPECT}"
          VIDEO_COUNT="${DISPATCH_COUNT:-$MANUAL_COUNT}"

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: JOB_ID is empty"
            exit 1
          fi

          if [ -z "$VIDEO_SUBJECT" ]; then
            echo "ERROR: VIDEO_SUBJECT is empty"
            exit 1
          fi

          if [ -z "$ASPECT" ]; then
            ASPECT="9:16"
          fi

          if [ -z "$VIDEO_COUNT" ]; then
            VIDEO_COUNT="1"
          fi

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "VIDEO_SUBJECT=$VIDEO_SUBJECT" >> "$GITHUB_ENV"
          echo "ASPECT=$ASPECT" >> "$GITHUB_ENV"
          echo "VIDEO_COUNT=$VIDEO_COUNT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "MPT PIXABAY WORKER"
          echo "=========================================="
          echo "EVENT        : ${{ github.event_name }}"
          echo "JOB_ID       : $JOB_ID"
          echo "SUBJECT      : $VIDEO_SUBJECT"
          echo "ASPECT       : $ASPECT"
          echo "VIDEO COUNT  : $VIDEO_COUNT"
          echo "=========================================="


      # ============================================================
      # 2. Callback - Starting
      #    ONLY for real Render jobs
      # ============================================================

      - name: Callback - Starting
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 5,
              "stage": "starting"
            }'


      # ============================================================
      # 3. Checkout worker repository
      # ============================================================

      - name: Checkout worker repository
        uses: actions/checkout@v6


      # ============================================================
      # 4. Callback - Preparing
      #    ONLY for real Render jobs
      # ============================================================

      - name: Callback - Preparing
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 10,
              "stage": "preparing"
            }'


      # ============================================================
      # 5. Install system dependencies
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          ffmpeg -version | head -n 1
          python3 --version
          curl --version | head -n 1

          echo "=========================================="


      # ============================================================
      # 6. Clone MoneyPrinterTurbo
      # ============================================================

      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          echo "=========================================="
          echo "MONEYPRINTERTURBO"
          echo "=========================================="
          echo "Commit:"
          git rev-parse HEAD
          echo "=========================================="


      # ============================================================
      # 7. Install uv
      # ============================================================

      - name: Install uv
        shell: bash
        run: |
          set -e

          curl -LsSf https://astral.sh/uv/install.sh | sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          uv --version


      # ============================================================
      # 8. Install MPT dependencies
      # ============================================================

      - name: Install MPT dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          uv sync --frozen


      # ============================================================
      # 9. Verify Pixabay API key
      # ============================================================

      - name: Verify Pixabay configuration
        shell: bash
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: |
          set -e

          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "ERROR: PIXABAY_API_KEY GitHub Secret is missing."
            exit 1
          fi

          echo "Pixabay API key detected."
          echo "Key length: ${#PIXABAY_API_KEY}"


      # ============================================================
      # 10. Create MPT config.toml
      # ============================================================

      - name: Create MPT config
        working-directory: MoneyPrinterTurbo
        shell: bash
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: |
          set -e

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["PIXABAY_API_KEY"].strip()

          source = Path("config.example.toml")
          target = Path("config.toml")

          if not source.exists():
              raise SystemExit("ERROR: config.example.toml not found")

          text = source.read_text(encoding="utf-8")

          # Force Pixabay as video source.
          if 'video_source = "pexels"' in text:
              text = text.replace(
                  'video_source = "pexels"',
                  'video_source = "pixabay"',
                  1
              )
          elif 'video_source = "pixabay"' not in text:
              raise SystemExit(
                  "ERROR: Could not locate video_source setting in config.example.toml"
              )

          # Configure Pixabay API key.
          if "pixabay_api_keys = []" in text:
              text = text.replace(
                  "pixabay_api_keys = []",
                  f'pixabay_api_keys = ["{key}"]',
                  1
              )
          elif "pixabay_api_keys =" in text:
              import re

              text = re.sub(
                  r'^pixabay_api_keys\s*=.*$',
                  f'pixabay_api_keys = ["{key}"]',
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              raise SystemExit(
                  "ERROR: pixabay_api_keys setting not found"
              )

          target.write_text(text, encoding="utf-8")

          print("config.toml created successfully.")
          print("video_source = pixabay")
          print("pixabay_api_keys = [HIDDEN]")
          PY

          echo "=========================================="
          echo "MPT CONFIG CHECK"
          echo "=========================================="

          grep -n '^video_source' config.toml || true

          grep -n '^pixabay_api_keys' config.toml \
            | sed 's/=.*/= [HIDDEN]/'

          echo "=========================================="


      # ============================================================
      # 11. Callback - Pixabay materials
      #     ONLY for real Render jobs
      # ============================================================

      - name: Callback - Pixabay materials
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 25,
              "stage": "pixabay_materials"
            }'


      # ============================================================
      # 12. Run MoneyPrinterTurbo
      # ============================================================

      - name: Run MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING MONEYPRINTERTURBO"
          echo "=========================================="

          echo "Subject:"
          echo "$VIDEO_SUBJECT"

          echo ""
          echo "Video source:"
          echo "pixabay"

          echo ""
          echo "Aspect:"
          echo "$ASPECT"

          echo ""
          echo "Video count:"
          echo "$VIDEO_COUNT"

          echo "=========================================="

          uv run python cli.py \
            --video-script "$VIDEO_SUBJECT" \
            --video-source pixabay \
            --video-aspect "$ASPECT" \
            --video-count "$VIDEO_COUNT" \
            --voice-name no-voice \
            --no-subtitle-enabled \
            --stop-at video


      # ============================================================
      # 13. Find generated video
      # ============================================================

      - name: Find generated video
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR GENERATED VIDEO"
          echo "=========================================="

          find storage/tasks \
            -type f \
            -name "final-*.mp4" \
            -print

          FINAL_VIDEO="$(
            find storage/tasks \
              -type f \
              -name "final-*.mp4" \
              | head -n 1
          )"

          if [ -z "$FINAL_VIDEO" ]; then
            echo "ERROR: No final MP4 was generated."

            echo ""
            echo "Available task files:"
            find storage/tasks \
              -maxdepth 5 \
              -type f \
              -print \
              | tail -n 100

            exit 1
          fi

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

          echo ""
          echo "VIDEO FOUND:"
          echo "$FINAL_VIDEO"

          echo "=========================================="


      # ============================================================
      # 14. Callback - Processing
      #     ONLY for real Render jobs
      # ============================================================

      - name: Callback - Processing
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 80,
              "stage": "processing"
            }'


      # ============================================================
      # 15. Upload video to Render
      #     ONLY for real Render jobs
      # ============================================================

      - name: Upload video to Render
        if: github.event_name == 'repository_dispatch'
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "UPLOADING VIDEO TO RENDER"
          echo "=========================================="

          RESPONSE="$(
            curl -sS -f \
              -X POST \
              "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
              -H "Content-Type: video/mp4" \
              -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
              --data-binary "@${FINAL_VIDEO}"
          )"

          echo "Upload response received."

          OUTPUT_URL="$(
            python3 -c '
          import json
          import sys

          data = json.loads(sys.stdin.read())

          if "output_url" not in data:
              raise SystemExit(
                  "ERROR: output_url missing from upload response"
              )

          print(data["output_url"])
          ' <<< "$RESPONSE"
          )"

          if [ -z "$OUTPUT_URL" ]; then
            echo "ERROR: OUTPUT_URL is empty"
            exit 1
          fi

          echo "OUTPUT_URL=$OUTPUT_URL" >> "$GITHUB_ENV"

          echo "Video uploaded successfully."
          echo "Output URL:"
          echo "$OUTPUT_URL"

          echo "=========================================="


      # ============================================================
      # 16. Upload final video artifact
      #     Works for manual AND real jobs
      # ============================================================

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpt-output-${{ github.run_number }}
          path: MoneyPrinterTurbo/${{ env.FINAL_VIDEO }}
          if-no-files-found: error


      # ============================================================
      # 17. Callback - Completed
      #     ONLY for real Render jobs
      # ============================================================

      - name: Callback - Completed
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          FULL_OUTPUT_URL="${RENDER_CALLBACK_URL}${OUTPUT_URL}"

          echo "=========================================="
          echo "CALLBACK - COMPLETED"
          echo "=========================================="
          echo "JOB_ID:"
          echo "$JOB_ID"
          echo ""
          echo "OUTPUT URL:"
          echo "$FULL_OUTPUT_URL"
          echo "=========================================="

          python3 - <<'PY' > /tmp/completed.json
          import json
          import os

          base = os.environ["RENDER_CALLBACK_URL"]
          output = os.environ["OUTPUT_URL"]

          payload = {
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url": base + output
          }

          print(json.dumps(payload))
          PY

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/completed.json

          echo ""
          echo "=========================================="
          echo "MPT PIXABAY WORKER — SUCCESS"
          echo "=========================================="


      # ============================================================
      # 18. Callback - Failed
      #     ONLY for real Render jobs
      # ============================================================

      - name: Callback - Failed
        if: failure() && github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "MPT PIXABAY WORKER — FAILED"
          echo "=========================================="
          echo "JOB_ID:"
          echo "$JOB_ID"
          echo "=========================================="

          curl -sS \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "failed",
              "progress": 100,
              "stage": "failed",
              "error": "GitHub MPT Pixabay Worker failed"
            }'

          echo "Failure callback sent."
