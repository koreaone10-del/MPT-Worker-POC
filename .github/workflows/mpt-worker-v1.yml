name: MPT OpenRouter + Pixabay Worker

on:
  repository_dispatch:
    types:
      - mpt_job

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    name: Generate MPT Video
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com

      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. PREPARE JOB VARIABLES
      # ============================================================

      - name: Prepare job variables
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os

          # --------------------------------------------------------
          # LOAD GITHUB EVENT
          # --------------------------------------------------------

          event_path = os.environ.get(
              "GITHUB_EVENT_PATH",
              ""
          )

          if not event_path:
              raise RuntimeError(
                  "GITHUB_EVENT_PATH is missing"
              )

          with open(
              event_path,
              "r",
              encoding="utf-8"
          ) as f:
              event = json.load(f)

          client_payload = (
              event.get(
                  "client_payload",
                  {}
              )
              or {}
          )

          request = (
              client_payload.get(
                  "request",
                  {}
              )
              or {}
          )

          # --------------------------------------------------------
          # JOB ID
          # --------------------------------------------------------

          job_id = str(
              client_payload.get(
                  "job_id",
                  ""
              )
          ).strip()

          if not job_id:
              raise RuntimeError(
                  "Missing job_id in repository_dispatch payload"
              )

          # --------------------------------------------------------
          # HELPERS
          # --------------------------------------------------------

          def clean(
              value,
              default=""
          ):
              if value is None:
                  return default

              return str(value).strip()

          def env_value(
              name,
              value
          ):
              value = (
                  ""
                  if value is None
                  else str(value)
              )

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      f"{name}<<__EOF__\n"
                  )
                  f.write(value)
                  f.write("\n__EOF__\n")

          # --------------------------------------------------------
          # REQUEST
          # --------------------------------------------------------

          subject = clean(
              request.get(
                  "subject",
                  ""
              ),
              "Create a short cinematic video"
          )

          aspect = clean(
              request.get(
                  "aspect_ratio",
                  "9:16"
              ),
              "9:16"
          )

          video_count = int(
              request.get(
                  "video_count",
                  1
              )
              or 1
          )

          language = clean(
              request.get(
                  "language",
                  "ar"
              ),
              "ar"
          ).lower()

          duration = int(
              request.get(
                  "duration",
                  30
              )
              or 30
          )

          voice = clean(
              request.get(
                  "voice",
                  "ar-male"
              ),
              "ar-male"
          ).lower()

          subtitles = request.get(
              "subtitles",
              True
          )

          if isinstance(
              subtitles,
              str
          ):
              subtitles = (
                  subtitles.lower()
                  not in {
                      "false",
                      "0",
                      "no",
                      "off"
                  }
              )

          subtitle_provider = clean(
              request.get(
                  "subtitle_provider",
                  "edge"
              ),
              "edge"
          ).lower()

          user_script = clean(
              request.get(
                  "script",
                  ""
              ),
              ""
          )

          music = request.get(
              "music",
              True
          )

          if isinstance(
              music,
              str
          ):
              music = (
                  music.lower()
                  not in {
                      "false",
                      "0",
                      "no",
                      "off"
                  }
              )

          video_source = clean(
              request.get(
                  "video_source",
                  "pixabay"
              ),
              "pixabay"
          ).lower()

          # --------------------------------------------------------
          # LANGUAGE
          # --------------------------------------------------------

          language_map = {
              "ar": "ar-SA",
              "fr": "fr-FR",
              "en": "en-US"
          }

          video_language = language_map.get(
              language,
              "ar-SA"
          )

          # --------------------------------------------------------
          # VOICE
          # --------------------------------------------------------

          voice_map = {
              "ar-male": "ar-SA-HamedNeural",
              "ar-female": "ar-SA-ZariyahNeural",

              "fr-male": "fr-FR-HenriNeural",
              "fr-female": "fr-FR-DeniseNeural",

              "en-male": "en-US-GuyNeural",
              "en-female": "en-US-JennyNeural"
          }

          if voice in {
              "none",
              "no-voice",
              "disabled",
              "off"
          }:
              voice_name = "no-voice"

          elif voice in voice_map:
              voice_name = voice_map[
                  voice
              ]

          elif "Neural" in voice:
              voice_name = voice

          elif voice == "male":
              voice_name = voice_map.get(
                  f"{language}-male",
                  "ar-SA-HamedNeural"
              )

          elif voice == "female":
              voice_name = voice_map.get(
                  f"{language}-female",
                  "ar-SA-ZariyahNeural"
              )

          else:
              voice_name = voice_map.get(
                  f"{language}-male",
                  "ar-SA-HamedNeural"
              )

          # --------------------------------------------------------
          # SUBTITLES
          # --------------------------------------------------------

          if not subtitles:
              subtitle_enabled = "false"
              subtitle_provider = "none"

          else:
              subtitle_enabled = "true"

              if subtitle_provider not in {
                  "edge",
                  "whisper",
                  "none"
              }:
                  subtitle_provider = "edge"

          # --------------------------------------------------------
          # MUSIC
          # --------------------------------------------------------

          bgm_type = (
              "random"
              if music
              else "none"
          )

          # --------------------------------------------------------
          # FONT
          # --------------------------------------------------------

          if language == "ar":
              font_name = (
                  "NotoSansArabicUI-Regular.ttf"
              )

              words_per_second = 2.0

          else:
              font_name = (
                  "NotoSans-Regular.ttf"
              )

              words_per_second = 2.25

          # --------------------------------------------------------
          # SCRIPT LENGTH
          # --------------------------------------------------------

          target_words = max(
              20,
              int(
                  duration *
                  words_per_second
              )
          )

          min_words = max(
              15,
              int(
                  target_words *
                  0.85
              )
          )

          max_words = max(
              min_words + 10,
              int(
                  target_words *
                  1.15
              )
          )

          if duration <= 60:
              paragraph_number = 1

          elif duration <= 90:
              paragraph_number = 2

          else:
              paragraph_number = 3

          # --------------------------------------------------------
          # SCRIPT PROMPT
          #
          # No triple-quoted Python string here.
          # This avoids YAML indentation problems.
          # --------------------------------------------------------

          prompt_lines = [
              "Create a highly relevant video script about:",
              "",
              subject,
              "",
              "STRICT REQUIREMENTS:",
              "",
              "1. Stay ONLY on the requested topic.",
              "2. Do not introduce unrelated subjects.",
              "3. Every sentence must directly support the topic.",
              "4. Use concrete visual nouns, locations, objects, people,",
              "   actions and situations that can be represented by stock",
              "   video footage.",
              "5. Avoid generic filler.",
              "6. Avoid unrelated examples.",
              "7. Avoid abstract statements when concrete visuals are possible.",
              "8. Make every sentence easy to match with stock footage.",
              "9. Keep the narrative coherent from beginning to end.",
              "10. Write the script in the requested language.",
              f"11. Target approximately {target_words} words.",
              f"12. Minimum {min_words} words.",
              f"13. Maximum {max_words} words.",
              f"14. Use {paragraph_number} paragraph(s).",
              "15. Do not add titles.",
              "16. Do not add markdown.",
              "17. Do not add bullet points.",
              "18. Return ONLY the final narration script.",
              "",
              "SUBJECT:",
              "",
              subject
          ]

          script_prompt = "\n".join(
              prompt_lines
          )

          # --------------------------------------------------------
          # WRITE VARIABLES TO GITHUB ENV
          # --------------------------------------------------------

          env_value(
              "JOB_ID",
              job_id
          )

          env_value(
              "VIDEO_SUBJECT",
              subject
          )

          env_value(
              "VIDEO_ASPECT",
              aspect
          )

          env_value(
              "VIDEO_COUNT",
              video_count
          )

          env_value(
              "VIDEO_LANGUAGE",
              video_language
          )

          env_value(
              "VIDEO_LANGUAGE_CODE",
              language
          )

          env_value(
              "TARGET_DURATION",
              duration
          )

          env_value(
              "VOICE_NAME",
              voice_name
          )

          env_value(
              "SUBTITLE_PROVIDER",
              subtitle_provider
          )

          env_value(
              "SUBTITLE_ENABLED",
              subtitle_enabled
          )

          env_value(
              "BGM_TYPE",
              bgm_type
          )

          env_value(
              "FONT_NAME",
              font_name
          )

          env_value(
              "PARAGRAPH_NUMBER",
              paragraph_number
          )

          env_value(
              "TARGET_WORDS",
              target_words
          )

          env_value(
              "MIN_WORDS",
              min_words
          )

          env_value(
              "MAX_WORDS",
              max_words
          )

          env_value(
              "SCRIPT_PROMPT",
              script_prompt
          )

          env_value(
              "USER_SCRIPT",
              user_script
          )

          env_value(
              "VIDEO_SOURCE",
              video_source
          )

          # --------------------------------------------------------
          # LOG
          # --------------------------------------------------------

          echo "============================================"
          echo "MPT JOB VARIABLES"
          echo "============================================"
          echo "JOB_ID: ${job_id}"
          echo "SUBJECT: ${subject}"
          echo "LANGUAGE: ${video_language}"
          echo "ASPECT: ${aspect}"
          echo "DURATION: ${duration}s"
          echo "VOICE: ${voice_name}"
          echo "SUBTITLES: ${subtitle_enabled}"
          echo "SUBTITLE PROVIDER: ${subtitle_provider}"
          echo "MUSIC: ${bgm_type}"
          echo "SOURCE: ${video_source}"
          echo "TARGET WORDS: ${target_words}"
          echo "============================================"


      # ============================================================
      # 3. CALLBACK - STARTING
      # ============================================================

      - name: Callback - Starting
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 5,
              "stage": "starting"
            }'


      # ============================================================
      # 4. CALLBACK - PREPARING
      # ============================================================

      - name: Callback - Preparing
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 15,
              "stage": "preparing"
            }'


      # ============================================================
      # 5. INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates \
            fonts-noto-core \
            fonts-noto-ui-core

          echo "System dependencies installed."


      # ============================================================
      # 6. CLONE MONEYPRINTERTURBO
      # ============================================================

      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          python3 -m pip install --upgrade pip

          pip install uv

          uv sync --frozen


      # ============================================================
      # 7. INSTALL FONTS INTO MPT
      # ============================================================

      - name: Install subtitle fonts
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          mkdir -p resource/fonts

          # --------------------------------------------------------
          # ARABIC FONT
          # --------------------------------------------------------

          ARABIC_FONT="$(
            find /usr/share/fonts \
              -type f \
              -iname "NotoSansArabic-Regular.ttf" \
              | head -n 1
          )"

          if [ -z "${ARABIC_FONT}" ]; then
            ARABIC_FONT="$(
              find /usr/share/fonts \
                -type f \
                -iname "*NotoSansArabic*.ttf" \
                | head -n 1
            )"
          fi

          # --------------------------------------------------------
          # LATIN FONT
          # --------------------------------------------------------

          LATIN_FONT="$(
            find /usr/share/fonts \
              -type f \
              -iname "NotoSans-Regular.ttf" \
              | head -n 1
          )"

          if [ -z "${LATIN_FONT}" ]; then
            LATIN_FONT="$(
              find /usr/share/fonts \
                -type f \
                -iname "*NotoSans-Regular.ttf" \
                | head -n 1
            )"
          fi

          if [ -z "${ARABIC_FONT}" ]; then
            echo "ERROR: Arabic Noto font not found."
            exit 1
          fi

          if [ -z "${LATIN_FONT}" ]; then
            echo "ERROR: Latin Noto font not found."
            exit 1
          fi

          cp \
            "${ARABIC_FONT}" \
            resource/fonts/NotoSansArabicUI-Regular.ttf

          cp \
            "${LATIN_FONT}" \
            resource/fonts/NotoSans-Regular.ttf

          echo "Installed MPT fonts:"
          ls -lah \
            resource/fonts/NotoSans*.ttf


      # ============================================================
      # 8. CONFIGURE MPT
      # ============================================================

      - name: Configure MPT
        shell: bash
        env:
          OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY_VALUE: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          cp config.example.toml config.toml

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(
              "config.toml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          openrouter_key = os.environ.get(
              "OPENROUTER_API_KEY_VALUE",
              ""
          )

          pixabay_key = os.environ.get(
              "PIXABAY_API_KEY_VALUE",
              ""
          )

          subtitle_provider = os.environ.get(
              "SUBTITLE_PROVIDER",
              "edge"
          )

          # --------------------------------------------------------
          # SIMPLE TOML REPLACER
          # --------------------------------------------------------

          def replace_string(
              source,
              key,
              value
          ):
              escaped = (
                  value
                  .replace(
                      "\\",
                      "\\\\"
                  )
                  .replace(
                      '"',
                      '\\"'
                  )
              )

              pattern = (
                  rf'(?m)^{re.escape(key)}\s*=\s*.*$'
              )

              replacement = (
                  f'{key} = "{escaped}"'
              )

              if re.search(
                  pattern,
                  source
              ):
                  return re.sub(
                      pattern,
                      replacement,
                      source,
                      count=1
                  )

              return source

          # --------------------------------------------------------
          # LLM
          # --------------------------------------------------------

          text = replace_string(
              text,
              "llm_provider",
              "openrouter"
          )

          text = replace_string(
              text,
              "openrouter_api_key",
              openrouter_key
          )

          text = replace_string(
              text,
              "openrouter_base_url",
              "https://openrouter.ai/api/v1"
          )

          text = replace_string(
              text,
              "openrouter_model_name",
              "openrouter/free"
          )

          # --------------------------------------------------------
          # VIDEO SOURCE
          # --------------------------------------------------------

          text = replace_string(
              text,
              "video_source",
              "pixabay"
          )

          # --------------------------------------------------------
          # PIXABAY
          # --------------------------------------------------------

          escaped_pixabay = (
              pixabay_key
              .replace(
                  "\\",
                  "\\\\"
              )
              .replace(
                  '"',
                  '\\"'
              )
          )

          pixabay_pattern = (
              r'(?m)^pixabay_api_keys\s*=\s*.*$'
          )

          pixabay_replacement = (
              'pixabay_api_keys = '
              f'["{escaped_pixabay}"]'
          )

          if re.search(
              pixabay_pattern,
              text
          ):
              text = re.sub(
                  pixabay_pattern,
                  pixabay_replacement,
                  text,
                  count=1
              )

          # --------------------------------------------------------
          # MATERIAL MATCHING
          # --------------------------------------------------------

          match_pattern = (
              r'(?m)^match_materials_to_script\s*=\s*.*$'
          )

          if re.search(
              match_pattern,
              text
          ):
              text = re.sub(
                  match_pattern,
                  "match_materials_to_script = true",
                  text,
                  count=1
              )

          # --------------------------------------------------------
          # SUBTITLE PROVIDER
          #
          # This belongs in config.toml.
          # It is NOT added to the batch manifest.
          # --------------------------------------------------------

          provider_pattern = (
              r'(?m)^subtitle_provider\s*=\s*.*$'
          )

          if re.search(
              provider_pattern,
              text
          ):
              text = re.sub(
                  provider_pattern,
                  f'subtitle_provider = "{subtitle_provider}"',
                  text,
                  count=1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MPT configuration prepared."
          )
          PY

          echo "============================================"
          echo "MPT CONFIGURATION"
          echo "============================================"

          grep -E \
            '^(llm_provider|openrouter_base_url|openrouter_model_name|video_source|pixabay_api_keys|match_materials_to_script|subtitle_provider)' \
            config.toml \
            || true

          echo "============================================"


      # ============================================================
      # 9. CALLBACK - GENERATING
      # ============================================================

      - name: Callback - Generating
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 30,
              "stage": "generating"
            }'


      # ============================================================
      # 10. CREATE MPT BATCH MANIFEST
      # ============================================================

      - name: Create MPT task
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          python3 <<'PY'
          import json
          import os

          subject = os.environ[
              "VIDEO_SUBJECT"
          ]

          aspect = os.environ[
              "VIDEO_ASPECT"
          ]

          language = os.environ[
              "VIDEO_LANGUAGE"
          ]

          video_count = int(
              os.environ[
                  "VIDEO_COUNT"
              ]
          )

          paragraph_number = int(
              os.environ[
                  "PARAGRAPH_NUMBER"
              ]
          )

          voice_name = os.environ[
              "VOICE_NAME"
          ]

          bgm_type = os.environ[
              "BGM_TYPE"
          ]

          subtitle_enabled = (
              os.environ[
                  "SUBTITLE_ENABLED"
              ].lower()
              == "true"
          )

          font_name = os.environ[
              "FONT_NAME"
          ]

          script_prompt = os.environ[
              "SCRIPT_PROMPT"
          ]

          user_script = os.environ.get(
              "USER_SCRIPT",
              ""
          ).strip()

          # --------------------------------------------------------
          # VIDEO PARAMS
          #
          # Only fields accepted by the current MPT VideoParams
          # are included here.
          # --------------------------------------------------------

          task = {
              "video_subject": subject,

              "video_source": "pixabay",

              "video_count": video_count,

              "video_aspect": aspect,

              "video_language": language,

              "paragraph_number": paragraph_number,

              "video_script_prompt": script_prompt,

              "video_concat_mode": "sequential",

              "video_clip_duration": 3,

              "video_clip_speed": 1.0,

              "match_materials_to_script": True,

              "video_fit_mode": "cover",

              "n_threads": 2,

              "voice_name": voice_name,

              "voice_volume": 1.0,

              "voice_rate": 1.0,

              "bgm_type": bgm_type,

              "bgm_file": "",

              "bgm_volume": 0.15,

              "subtitle_enabled": subtitle_enabled,

              "font_name": font_name
          }

          # --------------------------------------------------------
          # USER SCRIPT
          #
          # Only send video_script if the user supplied a complete
          # script. Otherwise MPT generates it from video_subject.
          # --------------------------------------------------------

          if user_script:
              task[
                  "video_script"
              ] = user_script

          # --------------------------------------------------------
          # IMPORTANT:
          # MPT batch-file accepts JSON ARRAY.
          # --------------------------------------------------------

          manifest = [
              task
          ]

          with open(
              "mpt-task.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # --------------------------------------------------------
          # VALIDATE MANIFEST BEFORE MPT
          # --------------------------------------------------------

          with open(
              "mpt-task.json",
              "r",
              encoding="utf-8"
          ) as f:
              check = json.load(f)

          if not isinstance(
              check,
              list
          ):
              raise RuntimeError(
                  "mpt-task.json must be a JSON array"
              )

          if len(check) != 1:
              raise RuntimeError(
                  "mpt-task.json must contain exactly one task"
              )

          if not isinstance(
              check[0],
              dict
          ):
              raise RuntimeError(
                  "MPT task must be a JSON object"
              )

          print(
              "============================================"
          )

          print(
              "MPT BATCH MANIFEST VALIDATION: OK"
          )

          print(
              "============================================"
          )

          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print(
              "============================================"
          )
          PY


      # ============================================================
      # 11. RUN MONEYPRINTERTURBO
      # ============================================================

      - name: Run MoneyPrinterTurbo
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          echo "============================================"
          echo "STARTING MONEYPRINTERTURBO"
          echo "============================================"

          echo "Subject: ${VIDEO_SUBJECT}"
          echo "Language: ${VIDEO_LANGUAGE}"
          echo "Aspect: ${VIDEO_ASPECT}"
          echo "Duration target: ${TARGET_DURATION}s"
          echo "Voice: ${VOICE_NAME}"
          echo "Subtitles: ${SUBTITLE_ENABLED}"
          echo "Subtitle provider: ${SUBTITLE_PROVIDER}"
          echo "Music: ${BGM_TYPE}"
          echo "Source: Pixabay"
          echo "============================================"

          uv run python cli.py \
            --batch-file ./mpt-task.json \
            --stop-at video


      # ============================================================
      # 12. FIND FINAL VIDEO
      # ============================================================

      - name: Find final video
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          echo "Searching generated videos..."

          find storage/tasks \
            -type f \
            \( \
              -name "final-*.mp4" \
              -o \
              -name "final.mp4" \
            \) \
            -print \
            | sort

          FINAL_VIDEO_PATH="$(
            find storage/tasks \
              -type f \
              \( \
                -name "final-*.mp4" \
                -o \
                -name "final.mp4" \
              \) \
              -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "${FINAL_VIDEO_PATH}" ]; then
            echo "ERROR: Final video not found."
            exit 1
          fi

          echo "Final video:"
          echo "${FINAL_VIDEO_PATH}"

          cp \
            "${FINAL_VIDEO_PATH}" \
            "${GITHUB_WORKSPACE}/final-video.mp4"

          echo \
            "FINAL_VIDEO=${GITHUB_WORKSPACE}/final-video.mp4" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 13. INSPECT FINAL VIDEO
      # ============================================================

      - name: Inspect final video
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: FINAL_VIDEO does not exist."
            exit 1
          fi

          ls -lh \
            "${FINAL_VIDEO}"

          echo "============================================"
          echo "FFPROBE"
          echo "============================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"


      # ============================================================
      # 14. CALLBACK - UPLOADING
      # ============================================================

      - name: Callback - Uploading
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 70,
              "stage": "uploading"
            }'


      # ============================================================
      # 15. UPLOAD VIDEO TO RENDER
      # ============================================================

      - name: Upload video to Render
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: Final video missing."
            exit 1
          fi

          echo "Uploading video to Render..."

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
            -H "X-Worker-Secret: ${CALLBACK_SECRET}" \
            -F "file=@${FINAL_VIDEO};type=video/mp4"

          echo "Upload completed."


      # ============================================================
      # 16. CALLBACK - COMPLETED
      # ============================================================

      - name: Callback - Completed
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url": "/api/jobs/'"${JOB_ID}"'/video"
            }'


      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mpt-video-${{ github.run_id }}
          path: final-video.mp4
          if-no-files-found: warn


      # ============================================================
      # 18. CALLBACK - FAILED
      # ============================================================

      - name: Callback - Failed
        if: failure()
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set +e

          if [ -z "${JOB_ID:-}" ]; then
            echo "JOB_ID is not available; skipping failed callback."
            exit 0
          fi

          ERROR_MESSAGE="GitHub Actions MPT worker failed."

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "failed",
              "progress": 0,
              "stage": "failed",
              "error": "'"${ERROR_MESSAGE}"'"
            }' || true
