name: MPT OpenRouter + Pixabay Worker

on:
  repository_dispatch:
    types:
      - mpt_job

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    name: Generate MPT Video
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com

      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      REQUEST_JSON: ${{ toJSON(github.event.client_payload.request) }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. PREPARE JOB VARIABLES
      # ============================================================
      - name: Prepare job variables
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re

          request_raw = os.environ.get("REQUEST_JSON", "{}").strip()

          try:
              request = json.loads(request_raw) if request_raw else {}
          except Exception:
              request = {}

          def clean(value, default=""):
              if value is None:
                  return default
              return str(value).strip()

          def env_value(name, value):
              value = "" if value is None else str(value)

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{name}<<__EOF__\n")
                  f.write(value)
                  f.write("\n__EOF__\n")

          # --------------------------------------------------------
          # BASIC REQUEST VALUES
          # --------------------------------------------------------

          job_id = clean(
              os.environ.get("GITHUB_EVENT_JOB_ID", ""),
              ""
          )

          # repository_dispatch payload
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")

          if event_path and os.path.exists(event_path):
              try:
                  with open(event_path, "r", encoding="utf-8") as f:
                      event = json.load(f)

                  client_payload = event.get("client_payload", {})

                  if not job_id:
                      job_id = clean(
                          client_payload.get("job_id", ""),
                          ""
                      )

                  if not request:
                      request = client_payload.get("request", {}) or {}

              except Exception:
                  pass

          if not job_id:
              raise RuntimeError("Missing job_id in repository_dispatch payload")

          subject = clean(
              request.get("subject", ""),
              "Create a short cinematic video"
          )

          aspect = clean(
              request.get("aspect_ratio", "9:16"),
              "9:16"
          )

          video_count = int(
              request.get("video_count", 1) or 1
          )

          language = clean(
              request.get("language", "ar"),
              "ar"
          ).lower()

          duration = int(
              request.get("duration", 30) or 30
          )

          voice = clean(
              request.get("voice", "ar-male"),
              "ar-male"
          ).lower()

          subtitles = request.get("subtitles", True)

          if isinstance(subtitles, str):
              subtitles = subtitles.lower() not in {
                  "false",
                  "0",
                  "no",
                  "off"
              }

          subtitle_provider = clean(
              request.get("subtitle_provider", "edge"),
              "edge"
          ).lower()

          script = clean(
              request.get("script", ""),
              ""
          )

          music = request.get("music", True)

          if isinstance(music, str):
              music = music.lower() not in {
                  "false",
                  "0",
                  "no",
                  "off"
              }

          video_source = clean(
              request.get("video_source", "pixabay"),
              "pixabay"
          ).lower()

          # --------------------------------------------------------
          # LANGUAGE
          # --------------------------------------------------------

          language_map = {
              "ar": "ar-SA",
              "fr": "fr-FR",
              "en": "en-US"
          }

          video_language = language_map.get(
              language,
              "ar-SA"
          )

          # --------------------------------------------------------
          # VOICE
          # --------------------------------------------------------

          voice_map = {
              "ar-male": "ar-SA-HamedNeural",
              "ar-female": "ar-SA-ZariyahNeural",

              "fr-male": "fr-FR-HenriNeural",
              "fr-female": "fr-FR-DeniseNeural",

              "en-male": "en-US-GuyNeural",
              "en-female": "en-US-JennyNeural",

              "male": {
                  "ar": "ar-SA-HamedNeural",
                  "fr": "fr-FR-HenriNeural",
                  "en": "en-US-GuyNeural"
              }.get(language, "ar-SA-HamedNeural"),

              "female": {
                  "ar": "ar-SA-ZariyahNeural",
                  "fr": "fr-FR-DeniseNeural",
                  "en": "en-US-JennyNeural"
              }.get(language, "ar-SA-ZariyahNeural")
          }

          if voice in {
              "none",
              "no-voice",
              "disabled",
              "off"
          }:
              voice_name = "no-voice"
          elif voice in voice_map:
              voice_name = voice_map[voice]
          elif "Neural" in voice:
              voice_name = voice
          else:
              voice_name = voice_map.get(
                  f"{language}-male",
                  "ar-SA-HamedNeural"
              )

          # --------------------------------------------------------
          # SUBTITLES
          # --------------------------------------------------------

          if not subtitles:
              subtitle_enabled = "false"
          else:
              subtitle_enabled = "true"

          if subtitle_provider not in {
              "edge",
              "whisper",
              "none"
          }:
              subtitle_provider = "edge"

          if not subtitles:
              subtitle_provider = "none"

          # --------------------------------------------------------
          # MUSIC
          # --------------------------------------------------------

          bgm_type = "random" if music else "none"

          # --------------------------------------------------------
          # FONT
          # --------------------------------------------------------

          if language == "ar":
              font_name = "NotoSansArabicUI-Regular.ttf"
              words_per_second = 2.0
          else:
              font_name = "NotoSans-Regular.ttf"
              words_per_second = 2.25

          # --------------------------------------------------------
          # SCRIPT LENGTH
          # --------------------------------------------------------

          target_words = max(
              20,
              int(duration * words_per_second)
          )

          min_words = max(
              15,
              int(target_words * 0.85)
          )

          max_words = max(
              min_words + 10,
              int(target_words * 1.15)
          )

          if duration <= 60:
              paragraph_number = 1
          elif duration <= 90:
              paragraph_number = 2
          else:
              paragraph_number = 3

          # --------------------------------------------------------
          # SCRIPT PROMPT
          # --------------------------------------------------------

          script_prompt = f"""
          Create a highly relevant video script about:

          {subject}

          STRICT REQUIREMENTS:

          1. Stay ONLY on the requested topic.
          2. Do not introduce unrelated subjects.
          3. Every sentence must directly support the topic.
          4. Use concrete visual nouns, locations, objects, people,
             actions and situations that can be represented by stock
             video footage.
          5. Avoid generic filler.
          6. Avoid philosophical or abstract sentences when a concrete
             visual description is possible.
          7. The visual meaning of each sentence must be easy to match
             with stock footage.
          8. Keep the narrative coherent from beginning to end.
          9. Write in the requested language.
          10. Target approximately {target_words} words.
          11. Minimum {min_words} words.
          12. Maximum {max_words} words.
          13. Use {paragraph_number} paragraph(s).
          14. Do not add titles, markdown, bullet points or explanations.
          15. Return ONLY the final narration script.

          SUBJECT:
          {subject}
          """.strip()

          # --------------------------------------------------------
          # WRITE VARIABLES TO GITHUB_ENV
          # --------------------------------------------------------

          env_value("JOB_ID", job_id)
          env_value("VIDEO_SUBJECT", subject)
          env_value("VIDEO_ASPECT", aspect)
          env_value("VIDEO_COUNT", video_count)
          env_value("VIDEO_LANGUAGE", video_language)
          env_value("VIDEO_LANGUAGE_CODE", language)
          env_value("TARGET_DURATION", duration)
          env_value("VOICE_NAME", voice_name)
          env_value("SUBTITLE_PROVIDER", subtitle_provider)
          env_value("SUBTITLE_ENABLED", subtitle_enabled)
          env_value("BGM_TYPE", bgm_type)
          env_value("FONT_NAME", font_name)
          env_value("PARAGRAPH_NUMBER", paragraph_number)
          env_value("TARGET_WORDS", target_words)
          env_value("MIN_WORDS", min_words)
          env_value("MAX_WORDS", max_words)
          env_value("SCRIPT_PROMPT", script_prompt)
          env_value("USER_SCRIPT", script)
          env_value("VIDEO_SOURCE", video_source)

          print("============================================")
          print("MPT JOB VARIABLES")
          print("============================================")
          print(f"JOB_ID: {job_id}")
          print(f"SUBJECT: {subject}")
          print(f"LANGUAGE: {video_language}")
          print(f"ASPECT: {aspect}")
          print(f"DURATION: {duration}s")
          print(f"VOICE: {voice_name}")
          print(f"SUBTITLES: {subtitle_enabled}")
          print(f"SUBTITLE PROVIDER: {subtitle_provider}")
          print(f"MUSIC: {bgm_type}")
          print(f"VIDEO SOURCE: {video_source}")
          print(f"TARGET WORDS: {target_words}")
          print("============================================")
          PY


      # ============================================================
      # 3. CALLBACK - STARTING
      #
      # IMPORTANT:
      # The successful workflow used X-Callback-Secret.
      # DO NOT replace this with X-Worker-Secret.
      # ============================================================
      - name: Callback - Starting
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 5,
              "stage": "starting"
            }'


      # ============================================================
      # 4. CALLBACK - PREPARING
      # ============================================================
      - name: Callback - Preparing
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 15,
              "stage": "preparing"
            }'


      # ============================================================
      # 5. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates \
            fonts-noto-core \
            fonts-noto-ui-core

          mkdir -p /tmp/mpt-fonts

          # Arabic
          find /usr/share/fonts -type f \
            \( -iname "*NotoSansArabic*.ttf" -o -iname "*NotoNaskhArabic*.ttf" \) \
            | head -n 1 \
            | xargs -r -I{} cp "{}" /tmp/mpt-fonts/NotoSansArabicUI-Regular.ttf

          # Latin
          find /usr/share/fonts -type f \
            \( -iname "NotoSans-Regular.ttf" -o -iname "*NotoSans-Regular.ttf" \) \
            | head -n 1 \
            | xargs -r -I{} cp "{}" /tmp/mpt-fonts/NotoSans-Regular.ttf

          echo "Installed fonts:"
          ls -lah /tmp/mpt-fonts || true


      # ============================================================
      # 6. CLONE MONEYPRINTERTURBO
      # ============================================================
      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git

          cd MoneyPrinterTurbo

          python3 -m pip install --upgrade pip

          pip install uv

          uv sync --frozen


      # ============================================================
      # 7. CONFIGURE MPT
      # ============================================================
      - name: Configure MPT
        shell: bash
        env:
          OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY_VALUE: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          cp config.example.toml config.toml

          python3 <<'PY'
          from pathlib import Path

          path = Path("config.toml")

          text = path.read_text(
              encoding="utf-8"
          )

          replacements = {
              'llm_provider = "openai"':
                  'llm_provider = "openrouter"',

              'video_source = "pexels"':
                  'video_source = "pixabay"',

              'openrouter_base_url = ""':
                  'openrouter_base_url = "https://openrouter.ai/api/v1"',

              'openrouter_model_name = "gpt-3.5-turbo"':
                  'openrouter_model_name = "openrouter/free"',

              'match_materials_to_script = false':
                  'match_materials_to_script = true',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("config.toml")
          text = path.read_text(encoding="utf-8")

          openrouter_key = os.environ.get(
              "OPENROUTER_API_KEY_VALUE",
              ""
          )

          pixabay_key = os.environ.get(
              "PIXABAY_API_KEY_VALUE",
              ""
          )

          # --------------------------------------------------------
          # OpenRouter
          # --------------------------------------------------------

          text = text.replace(
              'openrouter_api_key = ""',
              'openrouter_api_key = "' +
              openrouter_key.replace('"', '\\"') +
              '"'
          )

          text = text.replace(
              'openrouter_base_url = ""',
              'openrouter_base_url = "https://openrouter.ai/api/v1"'
          )

          text = text.replace(
              'openrouter_model_name = "gpt-3.5-turbo"',
              'openrouter_model_name = "openrouter/free"'
          )

          # --------------------------------------------------------
          # Pixabay
          # --------------------------------------------------------

          escaped_pixabay = pixabay_key.replace(
              '"',
              '\\"'
          )

          text = text.replace(
              'pixabay_api_keys = []',
              f'pixabay_api_keys = ["{escaped_pixabay}"]'
          )

          # --------------------------------------------------------
          # Script/material matching
          # --------------------------------------------------------

          text = text.replace(
              'match_materials_to_script = false',
              'match_materials_to_script = true'
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "MPT configuration prepared."


      # ============================================================
      # 8. CALLBACK - GENERATING
      # ============================================================
      - name: Callback - Generating
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 30,
              "stage": "generating"
            }'


      # ============================================================
      # 9. CREATE MPT TASK
      # ============================================================
      - name: Create MPT task
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          python3 <<'PY'
          import json
          import os

          subject = os.environ["VIDEO_SUBJECT"]
          aspect = os.environ["VIDEO_ASPECT"]
          language = os.environ["VIDEO_LANGUAGE"]
          video_count = int(os.environ["VIDEO_COUNT"])
          paragraph_number = int(os.environ["PARAGRAPH_NUMBER"])
          voice_name = os.environ["VOICE_NAME"]
          bgm_type = os.environ["BGM_TYPE"]
          subtitle_enabled = os.environ["SUBTITLE_ENABLED"] == "true"
          subtitle_provider = os.environ["SUBTITLE_PROVIDER"]
          font_name = os.environ["FONT_NAME"]
          script_prompt = os.environ["SCRIPT_PROMPT"]
          user_script = os.environ.get("USER_SCRIPT", "").strip()

          task = {
              "video_subject": subject,

              "video_source": "pixabay",

              "video_count": video_count,

              "video_aspect": aspect,

              "video_language": language,

              "paragraph_number": paragraph_number,

              "video_script_prompt": script_prompt,

              "video_concat_mode": "sequential",

              "video_transition_mode": "None",

              "video_clip_duration": 3,

              "video_clip_speed": 1.0,

              "match_materials_to_script": True,

              "video_fit_mode": "cover",

              "n_threads": 2,

              "voice_name": voice_name,

              "voice_volume": 1.0,

              "voice_rate": 1.0,

              "bgm_type": bgm_type,

              "bgm_file": "",

              "bgm_volume": 0.15,

              "subtitle_enabled": subtitle_enabled,

              "subtitle_provider": subtitle_provider,

              "font_name": font_name
          }

          # IMPORTANT:
          # Only pass video_script when the user actually supplied
          # a complete script. Otherwise MPT must generate the script
          # from video_subject using OpenRouter.
          if user_script:
              task["video_script"] = user_script

          with open(
              "mpt-task.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  task,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  task,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY


      # ============================================================
      # 10. RUN MPT
      # ============================================================
      - name: Run MoneyPrinterTurbo
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          echo "============================================"
          echo "STARTING MONEYPRINTERTURBO"
          echo "============================================"

          echo "Subject: ${VIDEO_SUBJECT}"
          echo "Language: ${VIDEO_LANGUAGE}"
          echo "Aspect: ${VIDEO_ASPECT}"
          echo "Voice: ${VOICE_NAME}"
          echo "Subtitles: ${SUBTITLE_ENABLED}"
          echo "Subtitle provider: ${SUBTITLE_PROVIDER}"
          echo "Music: ${BGM_TYPE}"
          echo "Source: Pixabay"
          echo "============================================"

          uv run python cli.py \
            --batch-file ./mpt-task.json \
            --stop-at video


      # ============================================================
      # 11. FIND FINAL VIDEO
      # ============================================================
      - name: Find final video
        shell: bash
        run: |
          set -euo pipefail

          cd MoneyPrinterTurbo

          echo "Searching generated videos..."

          find storage/tasks \
            -type f \
            \( \
              -name "final-*.mp4" \
              -o \
              -name "final.mp4" \
            \) \
            -print \
            | sort

          FINAL_VIDEO_PATH="$(
            find storage/tasks \
              -type f \
              \( \
                -name "final-*.mp4" \
                -o \
                -name "final.mp4" \
              \) \
              -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "${FINAL_VIDEO_PATH}" ]; then
            echo "ERROR: Final video not found."
            exit 1
          fi

          echo "Final video:"
          echo "${FINAL_VIDEO_PATH}"

          cp \
            "${FINAL_VIDEO_PATH}" \
            "${GITHUB_WORKSPACE}/final-video.mp4"

          echo "FINAL_VIDEO=${GITHUB_WORKSPACE}/final-video.mp4" >> "$GITHUB_ENV"


      # ============================================================
      # 12. INSPECT VIDEO
      # ============================================================
      - name: Inspect final video
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: FINAL_VIDEO does not exist."
            exit 1
          fi

          ls -lh "${FINAL_VIDEO}"

          echo "============================================"
          echo "FFPROBE"
          echo "============================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"


      # ============================================================
      # 13. CALLBACK - UPLOADING
      # ============================================================
      - name: Callback - Uploading
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 70,
              "stage": "uploading"
            }'


      # ============================================================
      # 14. UPLOAD VIDEO TO RENDER
      # ============================================================
      - name: Upload video to Render
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: Final video missing."
            exit 1
          fi

          echo "Uploading video to Render..."

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
            -H "X-Worker-Secret: ${CALLBACK_SECRET}" \
            -F "file=@${FINAL_VIDEO};type=video/mp4"

          echo "Upload completed."


      # ============================================================
      # 15. CALLBACK - COMPLETED
      # ============================================================
      - name: Callback - Completed
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url": "/api/jobs/'"${JOB_ID}"'/video"
            }'


      # ============================================================
      # 16. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mpt-video-${{ github.run_id }}
          path: final-video.mp4
          if-no-files-found: warn


      # ============================================================
      # 17. CALLBACK - FAILED
      # ============================================================
      - name: Callback - Failed
        if: failure()
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          set +e

          ERROR_MESSAGE="GitHub Actions MPT worker failed."

          curl --fail-with-body -sS \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${CALLBACK_SECRET}" \
            -d '{
              "status": "failed",
              "progress": 0,
              "stage": "failed",
              "error": "'"${ERROR_MESSAGE}"'"
            }' || true
