name: MPT Worker v1

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      video_subject:
        description: "Video subject"
        required: true
        type: string

      aspect:
        description: "Video aspect ratio"
        required: true
        default: "9:16"
        type: string

      video_count:
        description: "Number of videos"
        required: true
        default: "1"
        type: string

  repository_dispatch:
    types:
      - mpt_job

permissions:
  contents: read

env:
  RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com
  RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

jobs:
  mpt:
    name: MPT OpenRouter + Pixabay Worker
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. READ THE COMPLETE REQUEST FROM RENDER
      # ============================================================

      - name: Prepare job variables
        shell: bash
        env:
          REQUEST_JSON: ${{ toJSON(github.event.client_payload.request) }}

          DISPATCH_JOB_ID: ${{ github.event.client_payload.job_id }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.video_subject }}
          DISPATCH_ASPECT: ${{ github.event.client_payload.aspect }}
          DISPATCH_COUNT: ${{ github.event.client_payload.video_count }}

          MANUAL_JOB_ID: ${{ inputs.job_id }}
          MANUAL_SUBJECT: ${{ inputs.video_subject }}
          MANUAL_ASPECT: ${{ inputs.aspect }}
          MANUAL_COUNT: ${{ inputs.video_count }}

        run: |
          set -e

          python3 - <<'PY'
          import json
          import os

          request_raw = os.environ.get("REQUEST_JSON", "").strip()

          if request_raw and request_raw != "null":
              try:
                  request = json.loads(request_raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"ERROR: invalid request JSON: {exc}"
                  )
          else:
              request = {}

          def first_value(*values, default=""):
              for value in values:
                  if value is None:
                      continue
                  value = str(value).strip()
                  if value:
                      return value
              return default

          job_id = first_value(
              request.get("job_id"),
              os.environ.get("DISPATCH_JOB_ID"),
              os.environ.get("MANUAL_JOB_ID"),
          )

          subject = first_value(
              request.get("subject"),
              os.environ.get("DISPATCH_SUBJECT"),
              os.environ.get("MANUAL_SUBJECT"),
          )

          aspect = first_value(
              request.get("aspect_ratio"),
              os.environ.get("DISPATCH_ASPECT"),
              os.environ.get("MANUAL_ASPECT"),
              default="9:16",
          )

          count = first_value(
              request.get("video_count"),
              os.environ.get("DISPATCH_COUNT"),
              os.environ.get("MANUAL_COUNT"),
              default="1",
          )

          language = first_value(
              request.get("language"),
              default="ar",
          )

          duration = first_value(
              request.get("duration"),
              default="30",
          )

          voice = first_value(
              request.get("voice"),
              default="ar-male",
          )

          subtitles = request.get("subtitles", True)

          subtitle_provider = first_value(
              request.get("subtitle_provider"),
              default="edge",
          )

          video_source = first_value(
              request.get("video_source"),
              default="pixabay",
          )

          music = request.get("music", True)

          user_script = first_value(
              request.get("script"),
              default="",
          )

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          allowed_aspects = {
              "9:16",
              "16:9",
              "1:1",
          }

          allowed_durations = {
              "30",
              "45",
              "60",
              "90",
              "120",
          }

          if not job_id:
              raise SystemExit("ERROR: JOB_ID is empty")

          if not subject and not user_script:
              raise SystemExit(
                  "ERROR: both subject and script are empty"
              )

          if aspect not in allowed_aspects:
              aspect = "9:16"

          if duration not in allowed_durations:
              duration = "30"

          try:
              count_int = int(count)
          except ValueError:
              count_int = 1

          count_int = max(1, min(5, count_int))

          language = language.lower()

          if language not in {
              "ar",
              "fr",
              "en",
          }:
              language = "ar"

          subtitle_provider = subtitle_provider.lower()

          if subtitle_provider not in {
              "edge",
              "whisper",
              "none",
          }:
              subtitle_provider = "edge"

          # This project intentionally uses Pixabay.
          video_source = "pixabay"

          # --------------------------------------------------------
          # LANGUAGE CODES
          # --------------------------------------------------------

          language_codes = {
              "ar": "ar-SA",
              "fr": "fr-FR",
              "en": "en-US",
          }

          video_language = language_codes[language]

          # --------------------------------------------------------
          # VOICE MAPPING
          # --------------------------------------------------------

          voice_key = voice.strip().lower()

          voice_map = {
              "ar-male": "ar-SA-HamedNeural",
              "ar-female": "ar-SA-ZariyahNeural",

              "fr-male": "fr-FR-HenriNeural",
              "fr-female": "fr-FR-DeniseNeural",

              "en-male": "en-US-GuyNeural",
              "en-female": "en-US-JennyNeural",

              "male": {
                  "ar": "ar-SA-HamedNeural",
                  "fr": "fr-FR-HenriNeural",
                  "en": "en-US-GuyNeural",
              }[language],

              "female": {
                  "ar": "ar-SA-ZariyahNeural",
                  "fr": "fr-FR-DeniseNeural",
                  "en": "en-US-JennyNeural",
              }[language],
          }

          if voice_key in {
              "",
              "none",
              "no-voice",
              "disabled",
          }:
              voice_name = "no-voice"

          elif voice_key in voice_map:
              voice_name = voice_map[voice_key]

          elif "neural" in voice:
              voice_name = voice.strip()

          else:
              voice_name = voice_map.get(
                  f"{language}-male",
                  "en-US-GuyNeural",
              )

          # --------------------------------------------------------
          # SUBTITLE SETTINGS
          # --------------------------------------------------------

          subtitle_enabled = bool(subtitles)

          if not subtitle_enabled:
              subtitle_provider = ""

          elif subtitle_provider == "none":
              subtitle_provider = ""

          # --------------------------------------------------------
          # MUSIC SETTINGS
          # --------------------------------------------------------

          bgm_type = "random" if bool(music) else ""

          # --------------------------------------------------------
          # SCRIPT LENGTH TARGET
          # --------------------------------------------------------

          duration_int = int(duration)

          words_per_second = {
              "ar": 2.0,
              "fr": 2.25,
              "en": 2.25,
          }[language]

          target_words = round(
              duration_int * words_per_second
          )

          min_words = max(
              20,
              round(target_words * 0.88)
          )

          max_words = round(
              target_words * 1.12
          )

          # --------------------------------------------------------
          # SCRIPT INSTRUCTION
          # --------------------------------------------------------

          script_prompt = (
              f"Create a professional short-form video narration "
              f"in {video_language}. "
              f"The requested final duration is approximately "
              f"{duration_int} seconds. "
              f"Write approximately {target_words} words, "
              f"with an acceptable range of {min_words}-{max_words} words. "
              f"Do not write a title. "
              f"Do not add scene labels. "
              f"Do not add bullet points. "
              f"Do not explain your instructions. "
              f"Write only the narration. "
              f"Make every sentence useful for visual storytelling. "
              f"Use natural spoken language suitable for a short "
              f"social-media video. "
              f"Keep the narration tightly focused on this topic: "
              f"{subject}"
          )

          # --------------------------------------------------------
          # PARAGRAPH COUNT
          # --------------------------------------------------------

          if duration_int <= 60:
              paragraph_number = 1
          elif duration_int <= 90:
              paragraph_number = 2
          else:
              paragraph_number = 3

          # --------------------------------------------------------
          # WRITE GITHUB ENV SAFELY
          # --------------------------------------------------------

          env_file = os.environ["GITHUB_ENV"]

          values = {
              "JOB_ID": job_id,
              "VIDEO_SUBJECT": subject,
              "ASPECT": aspect,
              "VIDEO_COUNT": str(count_int),
              "LANGUAGE": language,
              "VIDEO_LANGUAGE": video_language,
              "DURATION": str(duration_int),
              "VOICE_NAME": voice_name,
              "SUBTITLE_ENABLED": "true" if subtitle_enabled else "false",
              "SUBTITLE_PROVIDER": subtitle_provider,
              "VIDEO_SOURCE": video_source,
              "BGM_TYPE": bgm_type,
              "USER_SCRIPT": user_script,
              "SCRIPT_PROMPT": script_prompt,
              "PARAGRAPH_NUMBER": str(paragraph_number),
              "TARGET_WORDS": str(target_words),
              "MIN_WORDS": str(min_words),
              "MAX_WORDS": str(max_words),
          }

          with open(env_file, "a", encoding="utf-8") as f:
              for name, value in values.items():
                  value = str(value)

                  delimiter = (
                      f"MPT_{name}_"
                      f"{os.getpid()}_END"
                  )

                  f.write(
                      f"{name}<<{delimiter}\n"
                  )
                  f.write(value)
                  f.write("\n")
                  f.write(f"{delimiter}\n")

          print("==========================================")
          print("MPT REQUEST")
          print("==========================================")
          print(f"JOB_ID            : {job_id}")
          print(f"SUBJECT           : {subject}")
          print(f"LANGUAGE          : {video_language}")
          print(f"ASPECT            : {aspect}")
          print(f"DURATION          : {duration_int}s")
          print(f"TARGET WORDS      : {target_words}")
          print(f"VOICE             : {voice_name}")
          print(f"SUBTITLES         : {subtitle_enabled}")
          print(f"SUBTITLE PROVIDER : {subtitle_provider or 'disabled'}")
          print(f"VIDEO SOURCE      : {video_source}")
          print(f"MUSIC             : {bgm_type or 'disabled'}")
          print(f"VIDEO COUNT       : {count_int}")
          print(f"USER SCRIPT       : {'YES' if user_script else 'NO'}")
          print("==========================================")


      # ============================================================
      # 2. CALLBACK STARTING
      # ============================================================

      - name: Callback - Starting
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 5,
              "stage": "starting"
            }'


      # ============================================================
      # 3. CHECKOUT
      # ============================================================

      - name: Checkout worker repository
        uses: actions/checkout@v6


      # ============================================================
      # 4. CALLBACK PREPARING
      # ============================================================

      - name: Callback - Preparing
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 10,
              "stage": "preparing"
            }'


      # ============================================================
      # 5. INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          ffmpeg -version | head -n 1
          python3 --version
          curl --version | head -n 1

          echo "=========================================="


      # ============================================================
      # 6. CLONE MONEYPRINTERTURBO
      # ============================================================

      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          echo "=========================================="
          echo "MONEYPRINTERTURBO"
          echo "=========================================="

          echo "Commit:"
          git rev-parse HEAD

          echo "=========================================="


      # ============================================================
      # 7. INSTALL UV
      # ============================================================

      - name: Install uv
        shell: bash
        run: |
          set -e

          curl -LsSf https://astral.sh/uv/install.sh | sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          uv --version


      # ============================================================
      # 8. INSTALL MPT DEPENDENCIES
      # ============================================================

      - name: Install MPT dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          uv sync --frozen


      # ============================================================
      # 9. VERIFY OPENROUTER
      # ============================================================

      - name: Verify OpenRouter configuration
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |
          set -e

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY is missing."
            exit 1
          fi

          echo "OpenRouter API key detected."
          echo "Key length: ${#OPENROUTER_API_KEY}"


      # ============================================================
      # 10. VERIFY PIXABAY
      # ============================================================

      - name: Verify Pixabay configuration
        shell: bash
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: |
          set -e

          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "ERROR: PIXABAY_API_KEY is missing."
            exit 1
          fi

          echo "Pixabay API key detected."
          echo "Key length: ${#PIXABAY_API_KEY}"


      # ============================================================
      # 11. CREATE MPT CONFIG
      # ============================================================

      - name: Create MPT config
        working-directory: MoneyPrinterTurbo
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: |
          set -e

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          openrouter_key = os.environ[
              "OPENROUTER_API_KEY"
          ].strip()

          pixabay_key = os.environ[
              "PIXABAY_API_KEY"
          ].strip()

          subtitle_provider = os.environ[
              "SUBTITLE_PROVIDER"
          ].strip()

          source = Path("config.example.toml")
          target = Path("config.toml")

          if not source.exists():
              raise SystemExit(
                  "ERROR: config.example.toml not found"
              )

          text = source.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # LLM PROVIDER
          # --------------------------------------------------------

          text = re.sub(
              r'^llm_provider\s*=.*$',
              'llm_provider = "openrouter"',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # OPENROUTER
          # --------------------------------------------------------

          text = re.sub(
              r'^openrouter_api_key\s*=.*$',
              "openrouter_api_key = "
              + json.dumps(openrouter_key),
              text,
              count=1,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^openrouter_base_url\s*=.*$',
              'openrouter_base_url = '
              '"https://openrouter.ai/api/v1"',
              text,
              count=1,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^openrouter_model_name\s*=.*$',
              'openrouter_model_name = '
              '"openrouter/free"',
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # PIXABAY
          # --------------------------------------------------------

          text = re.sub(
              r'^video_source\s*=.*$',
              'video_source = "pixabay"',
              text,
              count=1,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^pixabay_api_keys\s*=.*$',
              "pixabay_api_keys = "
              + json.dumps([pixabay_key]),
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # SUBTITLE PROVIDER
          # --------------------------------------------------------

          text = re.sub(
              r'^subtitle_provider\s*=.*$',
              "subtitle_provider = "
              + json.dumps(subtitle_provider),
              text,
              count=1,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # MATERIAL MATCHING
          # --------------------------------------------------------

          text = re.sub(
              r'^match_materials_to_script\s*=.*$',
              'match_materials_to_script = true',
              text,
              count=1,
              flags=re.MULTILINE
          )

          target.write_text(
              text,
              encoding="utf-8"
          )

          print("==========================================")
          print("MPT CONFIGURATION")
          print("==========================================")
          print("LLM              : OpenRouter")
          print("MODEL            : openrouter/free")
          print("VIDEO SOURCE     : Pixabay")
          print(
              "SUBTITLE PROVIDER:",
              subtitle_provider or "disabled"
          )
          print("SCRIPT MATCHING  : enabled")
          print("==========================================")
          PY

          echo ""
          echo "CONFIG CHECK"
          echo "------------"

          grep -n '^llm_provider' config.toml || true

          grep -n '^openrouter_base_url' config.toml || true

          grep -n '^openrouter_model_name' config.toml || true

          grep -n '^openrouter_api_key' config.toml \
            | sed 's/=.*/= [HIDDEN]/'

          grep -n '^video_source' config.toml || true

          grep -n '^pixabay_api_keys' config.toml \
            | sed 's/=.*/= [HIDDEN]/'

          grep -n '^subtitle_provider' config.toml || true

          grep -n '^match_materials_to_script' config.toml || true

          echo "------------"


      # ============================================================
      # 12. CREATE THE EXACT MPT TASK MANIFEST
      # ============================================================

      - name: Create MPT task manifest
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          subject = os.environ["VIDEO_SUBJECT"]
          user_script = os.environ["USER_SCRIPT"].strip()

          task = {
              "video_subject": subject,
              "video_script": user_script,
              "video_terms": [],
              "video_source": "pixabay",
              "video_materials": None,

              "video_count": int(
                  os.environ["VIDEO_COUNT"]
              ),

              "video_aspect": os.environ["ASPECT"],

              "video_language": os.environ[
                  "VIDEO_LANGUAGE"
              ],

              "paragraph_number": int(
                  os.environ["PARAGRAPH_NUMBER"]
              ),

              "video_script_prompt": os.environ[
                  "SCRIPT_PROMPT"
              ],

              "video_concat_mode": "sequential",

              "video_transition_mode": None,

              "video_clip_duration": 3,

              "video_clip_speed": 1.0,

              "match_materials_to_script": True,

              "video_fit_mode": "cover",

              "n_threads": 2,

              "voice_name": os.environ[
                  "VOICE_NAME"
              ],

              "voice_volume": 1.0,

              "voice_rate": 1.0,

              "bgm_type": os.environ[
                  "BGM_TYPE"
              ],

              "bgm_file": "",

              "bgm_volume": 0.15,

              "subtitle_enabled":
                  os.environ[
                      "SUBTITLE_ENABLED"
                  ].lower() == "true",
          }

          # Remove optional empty values that can interfere
          # with model validation.
          if not user_script:
              task.pop("video_script", None)

          if not task["video_terms"]:
              task.pop("video_terms")

          if task["video_materials"] is None:
              task.pop("video_materials")

          output = Path("mpt-task.json")

          output.write_text(
              json.dumps(
                  [task],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("==========================================")
          print("MPT TASK MANIFEST")
          print("==========================================")

          print(
              json.dumps(
                  {
                      **task,
                      "video_script":
                          "[USER SCRIPT]"
                          if user_script
                          else "[LLM GENERATED]"
                  },
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("==========================================")
          PY


      # ============================================================
      # 13. CALLBACK - AI SCRIPT
      # ============================================================

      - name: Callback - AI script
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 20,
              "stage": "ai_script"
            }'


      # ============================================================
      # 14. RUN MONEYPRINTERTURBO
      # ============================================================

      - name: Run MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING MONEYPRINTERTURBO"
          echo "=========================================="

          echo "Subject:"
          echo "$VIDEO_SUBJECT"

          echo ""
          echo "Language:"
          echo "$VIDEO_LANGUAGE"

          echo ""
          echo "Target duration:"
          echo "${DURATION}s"

          echo ""
          echo "Target words:"
          echo "$TARGET_WORDS"

          echo ""
          echo "Voice:"
          echo "$VOICE_NAME"

          echo ""
          echo "Subtitles:"
          echo "$SUBTITLE_ENABLED"

          echo ""
          echo "Subtitle provider:"
          echo "${SUBTITLE_PROVIDER:-disabled}"

          echo ""
          echo "Music:"
          echo "${BGM_TYPE:-disabled}"

          echo ""
          echo "Source:"
          echo "pixabay"

          echo ""
          echo "Aspect:"
          echo "$ASPECT"

          echo ""
          echo "Material matching:"
          echo "script order"

          echo "=========================================="

          uv run python cli.py \
            --batch-file ./mpt-task.json \
            --stop-at video


      # ============================================================
      # 15. FIND FINAL VIDEO
      # ============================================================

      - name: Find generated video
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR GENERATED VIDEO"
          echo "=========================================="

          find storage/tasks \
            -type f \
            -name "final-*.mp4" \
            -print

          FINAL_VIDEO="$(
            find storage/tasks \
              -type f \
              -name "final-*.mp4" \
              | sort \
              | head -n 1
          )"

          if [ -z "$FINAL_VIDEO" ]; then
            echo "ERROR: No final MP4 was generated."

            echo ""
            echo "Available task files:"

            find storage/tasks \
              -maxdepth 6 \
              -type f \
              -print \
              | tail -n 150

            exit 1
          fi

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

          echo ""
          echo "VIDEO FOUND:"
          echo "$FINAL_VIDEO"

          echo "=========================================="


      # ============================================================
      # 16. INSPECT FINAL VIDEO DURATION
      # ============================================================

      - name: Inspect final video
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL VIDEO INSPECTION"
          echo "=========================================="

          ACTUAL_DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FINAL_VIDEO"
          )"

          VIDEO_WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$FINAL_VIDEO"
          )"

          VIDEO_HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$FINAL_VIDEO"
          )"

          VIDEO_AUDIO="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$FINAL_VIDEO" \
              || true
          )"

          echo "Expected duration : ${DURATION}s"
          echo "Actual duration   : ${ACTUAL_DURATION}s"
          echo "Resolution        : ${VIDEO_WIDTH}x${VIDEO_HEIGHT}"
          echo "Audio codec       : ${VIDEO_AUDIO:-NONE}"

          echo "ACTUAL_DURATION=$ACTUAL_DURATION" >> "$GITHUB_ENV"

          echo "=========================================="


      # ============================================================
      # 17. CALLBACK - PROCESSING
      # ============================================================

      - name: Callback - Processing
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 85,
              "stage": "processing"
            }'


      # ============================================================
      # 18. UPLOAD VIDEO TO RENDER
      # ============================================================

      - name: Upload video to Render
        if: github.event_name == 'repository_dispatch'
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "UPLOADING VIDEO TO RENDER"
          echo "=========================================="

          RESPONSE="$(
            curl -sS -f \
              -X POST \
              "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
              -H "Content-Type: video/mp4" \
              -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
              --data-binary "@${FINAL_VIDEO}"
          )"

          echo "Upload response received."

          OUTPUT_URL="$(
            python3 -c '
          import json
          import sys

          data = json.loads(
              sys.stdin.read()
          )

          if "output_url" not in data:
              raise SystemExit(
                  "ERROR: output_url missing"
              )

          print(data["output_url"])
          ' <<< "$RESPONSE"
          )"

          if [ -z "$OUTPUT_URL" ]; then
            echo "ERROR: OUTPUT_URL is empty"
            exit 1
          fi

          echo "OUTPUT_URL=$OUTPUT_URL" >> "$GITHUB_ENV"

          echo "Video uploaded successfully."
          echo "Output URL:"
          echo "$OUTPUT_URL"

          echo "=========================================="


      # ============================================================
      # 19. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpt-output-${{ github.run_number }}
          path: MoneyPrinterTurbo/${{ env.FINAL_VIDEO }}
          if-no-files-found: error


      # ============================================================
      # 20. CALLBACK COMPLETED
      # ============================================================

      - name: Callback - Completed
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -e

          python3 - <<'PY' > /tmp/completed.json
          import json
          import os

          base = os.environ[
              "RENDER_CALLBACK_URL"
          ]

          output = os.environ[
              "OUTPUT_URL"
          ]

          payload = {
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url": base + output,
          }

          print(
              json.dumps(
                  payload,
                  ensure_ascii=False
              )
          )
          PY

          echo "=========================================="
          echo "CALLBACK - COMPLETED"
          echo "=========================================="

          cat /tmp/completed.json

          echo "=========================================="

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/completed.json

          echo ""
          echo "=========================================="
          echo "MPT OPENROUTER + PIXABAY"
          echo "WORKER — SUCCESS"
          echo "=========================================="


      # ============================================================
      # 21. CALLBACK FAILED
      # ============================================================

      - name: Callback - Failed
        if: failure() && github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "MPT OPENROUTER + PIXABAY"
          echo "WORKER — FAILED"
          echo "=========================================="

          echo "JOB_ID:"
          echo "$JOB_ID"

          echo "=========================================="

          curl -sS \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "failed",
              "progress": 100,
              "stage": "failed",
              "error": "GitHub MPT OpenRouter Pixabay Worker failed"
            }'

          echo "Failure callback sent."
