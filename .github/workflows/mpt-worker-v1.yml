name: MPT Worker v1

on:

  workflow_dispatch:

    inputs:

      job_id:
        description: "Job ID"
        required: true
        default: "manual-test-001"

      video_subject:
        description: "Video subject"
        required: true
        default: "How artificial intelligence is changing everyday life"

      aspect:
        description: "Video aspect ratio"
        required: true
        default: "9:16"

      video_count:
        description: "Number of videos"
        required: true
        default: "1"

  repository_dispatch:

    types:
      - mpt_job


permissions:

  contents: read


jobs:

  process:

    name: Process MPT Job

    runs-on: ubuntu-24.04

    timeout-minutes: 330

    env:

      EVENT_NAME: ${{ github.event_name }}

      DISPATCH_JOB_ID: ${{ github.event.client_payload.job_id }}

      DISPATCH_SUBJECT: ${{ github.event.client_payload.video_subject }}

      DISPATCH_ASPECT: ${{ github.event.client_payload.aspect }}

      DISPATCH_COUNT: ${{ github.event.client_payload.video_count }}

      MANUAL_JOB_ID: ${{ inputs.job_id }}

      MANUAL_SUBJECT: ${{ inputs.video_subject }}

      MANUAL_ASPECT: ${{ inputs.aspect }}

      MANUAL_COUNT: ${{ inputs.video_count }}

      RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com

      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}


    steps:

      - name: Checkout worker repository

        uses: actions/checkout@v6


      - name: Determine job payload

        shell: bash

        run: |

          set -e

          echo "Event: ${EVENT_NAME}"

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            JOB_ID="${DISPATCH_JOB_ID:-}"
            VIDEO_SUBJECT="${DISPATCH_SUBJECT:-}"
            ASPECT="${DISPATCH_ASPECT:-9:16}"
            VIDEO_COUNT="${DISPATCH_COUNT:-1}"
          else
            JOB_ID="${MANUAL_JOB_ID:-manual-test-001}"
            VIDEO_SUBJECT="${MANUAL_SUBJECT:-How artificial intelligence is changing everyday life}"
            ASPECT="${MANUAL_ASPECT:-9:16}"
            VIDEO_COUNT="${MANUAL_COUNT:-1}"
          fi

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: JOB_ID is empty"
            exit 1
          fi

          if [ -z "$VIDEO_SUBJECT" ]; then
            echo "ERROR: VIDEO_SUBJECT is empty"
            exit 1
          fi

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "VIDEO_SUBJECT=$VIDEO_SUBJECT" >> "$GITHUB_ENV"
          echo "ASPECT=$ASPECT" >> "$GITHUB_ENV"
          echo "VIDEO_COUNT=$VIDEO_COUNT" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "MPT JOB"
          echo "========================================"
          echo "Job ID:       $JOB_ID"
          echo "Subject:      $VIDEO_SUBJECT"
          echo "Aspect:       $ASPECT"
          echo "Video count:  $VIDEO_COUNT"
          echo "Callback URL: $RENDER_CALLBACK_URL"
          echo "========================================"


      # ======================================================
      # CALLBACK - STARTING
      # ======================================================

      - name: Callback - Starting

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "WARNING: RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 5,
              "stage": "starting"
            }'

          echo ""
          echo "Callback: 5% starting"


      # ======================================================
      # SYSTEM INFORMATION
      # ======================================================

      - name: System information

        shell: bash

        run: |

          echo "========================================"
          echo "SYSTEM INFORMATION"
          echo "========================================"

          echo "CPU:"
          nproc || true

          echo ""
          echo "MEMORY:"
          free -h || true

          echo ""
          echo "DISK:"
          df -h || true

          echo ""
          echo "Python:"
          python3 --version || true

          echo "========================================"


      # ======================================================
      # INSTALL SYSTEM PACKAGES
      # ======================================================

      - name: Install system packages

        shell: bash

        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            python3-venv \
            ca-certificates \
            curl \
            unzip \
            git


      # ======================================================
      # VERIFY FFMPEG
      # ======================================================

      - name: Verify FFmpeg

        shell: bash

        run: |

          set -e

          ffmpeg -version | head -n 1

          ffprobe -version | head -n 1


      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.11"


      # ======================================================
      # INSTALL UV
      # ======================================================

      - name: Install uv

        shell: bash

        run: |

          set -e

          python3 -m pip install --user uv

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          uv --version


      # ======================================================
      # CLONE MONEYPRINTERTURBO
      # ======================================================

      - name: Clone MoneyPrinterTurbo

        shell: bash

        run: |

          set -e

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          echo ""
          echo "MPT commit:"
          git rev-parse HEAD

          echo ""
          echo "MPT files:"
          ls -la

          echo ""

          test -f pyproject.toml
          test -f uv.lock
          test -f cli.py
          test -f requirements.txt


      # ======================================================
      # INSTALL MPT DEPENDENCIES
      # ======================================================

      - name: Install MPT dependencies

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          uv sync --frozen


      # ======================================================
      # VERIFY MPT ENVIRONMENT
      # ======================================================

      - name: Verify MPT environment

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          uv --version

          uv run python --version

          uv run python -c "import requests; print('requests:', requests.__version__)"

          echo ""
          echo "MPT environment ready"


      # ======================================================
      # CALLBACK - PREPARING
      # ======================================================

      - name: Callback - Preparing

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "WARNING: RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 15,
              "stage": "preparing"
            }'

          echo ""
          echo "Callback: 15% preparing"


      # ======================================================
      # CHECK TEST ASSET
      # ======================================================

      - name: Check test asset

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          if [ ! -f "./test_assets/test_source.mp4" ]; then

            echo "ERROR: test_assets/test_source.mp4 not found"

            echo ""
            echo "Available test assets:"

            find test_assets -maxdepth 2 -type f 2>/dev/null || true

            exit 1

          fi

          echo "Test source found:"

          ls -lh ./test_assets/test_source.mp4


      # ======================================================
      # CALLBACK - GENERATING
      # ======================================================

      - name: Callback - Generating

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "WARNING: RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 30,
              "stage": "generating"
            }'

          echo ""
          echo "Callback: 30% generating"


      # ======================================================
      # RUN MONEYPRINTERTURBO
      # ======================================================

      - name: Run MoneyPrinterTurbo

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          echo "========================================"
          echo "STARTING MONEYPRINTERTURBO"
          echo "========================================"

          echo "Job ID: $JOB_ID"
          echo "Subject: $VIDEO_SUBJECT"
          echo "Aspect: $ASPECT"
          echo "Count: $VIDEO_COUNT"

          echo "========================================"
          echo ""

          uv run python cli.py \
            --video-script "$VIDEO_SUBJECT" \
            --video-source local \
            --video-materials "./test_assets/test_source.mp4" \
            --video-aspect "$ASPECT" \
            --video-count "$VIDEO_COUNT" \
            --voice-name no-voice \
            --no-subtitle-enabled \
            --stop-at video


      # ======================================================
      # FIND OUTPUT VIDEO
      # ======================================================

      - name: Find generated videos

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          echo "Searching for generated MP4 files..."

          find storage/tasks -type f -name "final-*.mp4" -print || true

          FINAL_VIDEO="$(find storage/tasks -type f -name 'final-*.mp4' | head -n 1)"

          if [ -z "$FINAL_VIDEO" ]; then
            echo "ERROR: No final MP4 found"
            exit 1
          fi

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

          echo "Generated video:"

          ls -lh "$FINAL_VIDEO"


      # ======================================================
      # CALLBACK - PROCESSING
      # ======================================================

      - name: Callback - Processing

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "WARNING: RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 70,
              "stage": "processing"
            }'

          echo ""
          echo "Callback: 70% processing"


      # ======================================================
      # VERIFY MP4
      # ======================================================

      - name: Verify generated MP4

        shell: bash

        working-directory: MoneyPrinterTurbo

        run: |

          set -e

          echo "========================================"
          echo "MP4 VERIFICATION"
          echo "========================================"

          echo "File: $FINAL_VIDEO"
          echo ""

          CODEC="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO")"

          WIDTH="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO")"

          HEIGHT="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO")"

          FPS="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=r_frame_rate \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO")"

          DURATION="$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO")"

          SIZE="$(stat -c%s "$FINAL_VIDEO")"

          AUDIO_CODEC="$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_VIDEO" || true)"

          echo "Codec:        $CODEC"
          echo "Width:        $WIDTH"
          echo "Height:       $HEIGHT"
          echo "FPS:          $FPS"
          echo "Audio codec:  $AUDIO_CODEC"
          echo "Duration:     $DURATION"
          echo "Size:         $SIZE bytes"

          echo ""

          if [ "$CODEC" != "h264" ]; then
            echo "ERROR: Expected H.264 video"
            exit 1
          fi

          if [ "$WIDTH" != "1080" ]; then
            echo "WARNING: Width is $WIDTH"
          fi

          if [ "$HEIGHT" != "1920" ]; then
            echo "WARNING: Height is $HEIGHT"
          fi

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Video file is empty"
            exit 1
          fi

          echo ""
          echo "MP4 verification: SUCCESS"


      # ======================================================
      # CALLBACK - FINALIZING
      # ======================================================

      - name: Callback - Finalizing

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "WARNING: RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "processing",
              "progress": 90,
              "stage": "finalizing"
            }'

          echo ""
          echo "Callback: 90% finalizing"


      # ======================================================
      # UPLOAD WORKER ARTIFACT
      # ======================================================

      - name: Upload worker artifact

        uses: actions/upload-artifact@v6

        with:

          name: mpt-worker-${{ github.run_id }}

          path: |
            MoneyPrinterTurbo/storage/tasks/**
            MoneyPrinterTurbo/*.log

          if-no-files-found: warn

          retention-days: 3


      # ======================================================
      # UPLOAD TASK ARTIFACT
      # ======================================================

      - name: Upload task artifact

        uses: actions/upload-artifact@v6

        with:

          name: mpt-task-${{ github.run_id }}

          path: |
            MoneyPrinterTurbo/storage/tasks/**/final-*.mp4

          if-no-files-found: error

          retention-days: 3


      # ======================================================
      # CALLBACK - COMPLETED
      # ======================================================

      - name: Callback - Completed

        if: success()

        shell: bash

        run: |

          set -e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "ERROR: RENDER_CALLBACK_SECRET is not configured"
            exit 1
          fi

          curl -sS -f -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "completed",
              "progress": 100,
              "stage": "completed"
            }'

          echo ""

          echo "========================================"
          echo "MPT WORKER v1 — SUCCESS"
          echo "========================================"

          echo "Job ID:    $JOB_ID"
          echo "Subject:   $VIDEO_SUBJECT"
          echo "Aspect:    $ASPECT"
          echo "Count:     $VIDEO_COUNT"
          echo "Video:     $FINAL_VIDEO"
          echo "Status:    COMPLETED"

          echo "========================================"


      # ======================================================
      # CALLBACK - FAILED
      # ======================================================

      - name: Callback - Failed

        if: failure()

        shell: bash

        run: |

          set +e

          if [ -z "$RENDER_CALLBACK_SECRET" ]; then
            echo "RENDER_CALLBACK_SECRET is not configured"
            exit 0
          fi

          curl -sS -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "failed",
              "progress": 100,
              "stage": "failed",
              "error": "GitHub MPT Worker failed"
            }'

          echo ""
          echo "Callback: FAILED"
          echo "Job ID: $JOB_ID"
