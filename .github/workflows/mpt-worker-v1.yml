name: MPT Worker v1

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      video_subject:
        description: "Video subject"
        required: true
        type: string

      aspect:
        description: "Video aspect ratio"
        required: true
        default: "9:16"
        type: string

      video_count:
        description: "Number of videos"
        required: true
        default: "1"
        type: string

  repository_dispatch:
    types:
      - mpt_job

permissions:
  contents: read

env:
  RENDER_CALLBACK_URL: https://chibani-lotfi-ai.onrender.com
  RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

jobs:
  mpt:
    name: MPT Pixabay Worker
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Read job information
      # ============================================================

      - name: Prepare job variables
        shell: bash
        env:
          DISPATCH_JOB_ID: ${{ github.event.client_payload.job_id }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.video_subject }}
          DISPATCH_ASPECT: ${{ github.event.client_payload.aspect }}
          DISPATCH_COUNT: ${{ github.event.client_payload.video_count }}

          MANUAL_JOB_ID: ${{ inputs.job_id }}
          MANUAL_SUBJECT: ${{ inputs.video_subject }}
          MANUAL_ASPECT: ${{ inputs.aspect }}
          MANUAL_COUNT: ${{ inputs.video_count }}

        run: |
          set -e

          JOB_ID="${DISPATCH_JOB_ID:-$MANUAL_JOB_ID}"
          VIDEO_SUBJECT="${DISPATCH_SUBJECT:-$MANUAL_SUBJECT}"
          ASPECT="${DISPATCH_ASPECT:-$MANUAL_ASPECT}"
          VIDEO_COUNT="${DISPATCH_COUNT:-$MANUAL_COUNT}"

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: JOB_ID is empty"
            exit 1
          fi

          if [ -z "$VIDEO_SUBJECT" ]; then
            echo "ERROR: VIDEO_SUBJECT is empty"
            exit 1
          fi

          if [ -z "$ASPECT" ]; then
            ASPECT="9:16"
          fi

          if [ -z "$VIDEO_COUNT" ]; then
            VIDEO_COUNT="1"
          fi

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "VIDEO_SUBJECT=$VIDEO_SUBJECT" >> "$GITHUB_ENV"
          echo "ASPECT=$ASPECT" >> "$GITHUB_ENV"
          echo "VIDEO_COUNT=$VIDEO_COUNT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "MPT PIXABAY WORKER"
          echo "=========================================="
          echo "JOB_ID       : $JOB_ID"
          echo "SUBJECT      : $VIDEO_SUBJECT"
          echo "ASPECT       : $ASPECT"
          echo "VIDEO COUNT  : $VIDEO_COUNT"
          echo "=========================================="


      # ============================================================
      # 2. Callback: starting
      # ============================================================

      - name: Callback - Starting
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 5,
              "stage": "starting"
            }'


      # ============================================================
      # 3. Checkout worker repository
      # ============================================================

      - name: Checkout worker repository
        uses: actions/checkout@v4


      # ============================================================
      # 4. Callback: preparing
      # ============================================================

      - name: Callback - Preparing
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 10,
              "stage": "preparing"
            }'


      # ============================================================
      # 5. Install system dependencies
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            ca-certificates

          ffmpeg -version | head -n 1
          python3 --version
          curl --version | head -n 1


      # ============================================================
      # 6. Clone MoneyPrinterTurbo
      # ============================================================

      - name: Clone MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          rm -rf MoneyPrinterTurbo

          git clone \
            --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          cd MoneyPrinterTurbo

          echo "MPT commit:"
          git rev-parse HEAD


      # ============================================================
      # 7. Install uv
      # ============================================================

      - name: Install uv
        shell: bash
        run: |
          set -e

          curl -LsSf https://astral.sh/uv/install.sh | sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          uv --version


      # ============================================================
      # 8. Install MPT dependencies
      # ============================================================

      - name: Install MPT dependencies
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          uv sync --frozen


      # ============================================================
      # 9. Verify Pixabay secret
      # ============================================================

      - name: Verify Pixabay configuration
        shell: bash
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e

          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "ERROR: PIXABAY_API_KEY GitHub Secret is missing."
            exit 1
          fi

          echo "Pixabay API key detected."
          echo "Key length: ${#PIXABAY_API_KEY}"


      # ============================================================
      # 10. Create MPT config.toml
      # ============================================================

      - name: Create MPT config
        working-directory: MoneyPrinterTurbo
        shell: bash
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["PIXABAY_API_KEY"].strip()

          source = Path("config.example.toml")
          target = Path("config.toml")

          text = source.read_text(encoding="utf-8")

          text = text.replace(
              'video_source = "pexels"',
              'video_source = "pixabay"',
              1
          )

          text = text.replace(
              "pexels_api_keys = []",
              "pexels_api_keys = []",
              1
          )

          text = text.replace(
              "pixabay_api_keys = []",
              f'pixabay_api_keys = ["{key}"]',
              1
          )

          target.write_text(text, encoding="utf-8")

          print("config.toml created.")
          print("video_source = pixabay")
          print("pixabay_api_keys configured.")
          PY

          echo "Checking configuration..."

          grep -n '^video_source' config.toml
          grep -n '^pixabay_api_keys' config.toml | sed 's/=.*/= [HIDDEN]/'


      # ============================================================
      # 11. Callback: Pixabay material stage
      # ============================================================

      - name: Callback - Pixabay materials
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 25,
              "stage": "pixabay_materials"
            }'


      # ============================================================
      # 12. Run MoneyPrinterTurbo with Pixabay
      # ============================================================

      - name: Run MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING MONEYPRINTERTURBO"
          echo "=========================================="

          echo "Subject:"
          echo "$VIDEO_SUBJECT"

          echo "Source:"
          echo "pixabay"

          echo "Aspect:"
          echo "$ASPECT"

          echo "Count:"
          echo "$VIDEO_COUNT"

          echo "=========================================="

          uv run python cli.py \
            --video-script "$VIDEO_SUBJECT" \
            --video-source pixabay \
            --video-aspect "$ASPECT" \
            --video-count "$VIDEO_COUNT" \
            --voice-name no-voice \
            --no-subtitle-enabled \
            --stop-at video


      # ============================================================
      # 13. Locate generated video
      # ============================================================

      - name: Find generated video
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "Searching for generated MP4..."

          find storage/tasks \
            -type f \
            -name "final-*.mp4" \
            -print

          FINAL_VIDEO="$(find storage/tasks \
            -type f \
            -name "final-*.mp4" \
            | head -n 1)"

          if [ -z "$FINAL_VIDEO" ]; then
            echo "ERROR: No final MP4 was generated."
            echo ""
            echo "Last task directories:"
            find storage/tasks -maxdepth 3 -type f | tail -n 100
            exit 1
          fi

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "VIDEO FOUND"
          echo "$FINAL_VIDEO"
          echo "=========================================="


      # ============================================================
      # 14. Callback: processing
      # ============================================================

      - name: Callback - Processing
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "running",
              "progress": 80,
              "stage": "processing"
            }'


      # ============================================================
      # 15. Upload video to Render
      # ============================================================

      - name: Upload video to Render
        working-directory: MoneyPrinterTurbo
        shell: bash
        run: |
          set -e

          echo "Uploading final video to Render..."

          RESPONSE="$(
            curl -sS -f \
              -X POST \
              "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/upload" \
              -H "Content-Type: video/mp4" \
              -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
              --data-binary "@${FINAL_VIDEO}"
          )"

          echo "Upload response received."

          OUTPUT_URL="$(
            python3 -c '
          import json
          import sys

          data = json.loads(sys.stdin.read())

          if "output_url" not in data:
              raise SystemExit("output_url missing from upload response")

          print(data["output_url"])
          ' <<< "$RESPONSE"
          )"

          echo "OUTPUT_URL=$OUTPUT_URL" >> "$GITHUB_ENV"

          echo "Video uploaded successfully."


      # ============================================================
      # 16. Upload GitHub artifact
      # ============================================================

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpt-output-${{ github.run_number }}
          path: MoneyPrinterTurbo/${{ env.FINAL_VIDEO }}
          if-no-files-found: error


      # ============================================================
      # 17. Callback: completed
      # ============================================================

      - name: Callback - Completed
        shell: bash
        run: |
          set -e

          curl -sS -f \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data "{
              \"status\": \"completed\",
              \"progress\": 100,
              \"stage\": \"completed\",
              \"output_url\": \"${RENDER_CALLBACK_URL}${OUTPUT_URL}\"
            }"

          echo "=========================================="
          echo "MPT PIXABAY WORKER — SUCCESS"
          echo "=========================================="
          echo "JOB_ID:"
          echo "$JOB_ID"
          echo ""
          echo "OUTPUT:"
          echo "${RENDER_CALLBACK_URL}${OUTPUT_URL}"
          echo "=========================================="


      # ============================================================
      # 18. Callback: failed
      # ============================================================

      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          curl -sS \
            -X POST \
            "${RENDER_CALLBACK_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data '{
              "status": "failed",
              "progress": 100,
              "stage": "failed",
              "error": "GitHub MPT Pixabay Worker failed"
            }'

          echo "Worker failed."
